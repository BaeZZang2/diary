<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15131C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="마음결">
<title>마음결 · 감정일기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 나눔스퀘어 AC (네이버 나눔글꼴, 무료 배포). 300·400·700·800 네 굵기가 들어 있다.
     판을 @2.0 으로 못 박아 둔다. 그래야 저쪽이 바뀌어도 글씨가 갑자기 달라지지 않는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
:root{
  --r:14px; --sp:16px;
  --ui:'NanumSquareAc',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  /* 힘을 주는 자리. 서체를 바꾸지 않고 굵기로만 힘을 준다. */
  --se:'NanumSquareAc',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  /* 숫자·날짜 자리. 예전에는 고정폭 글씨를 썼는데 그 자리만 혼자 튀어 본문과 맞췄다.
     되돌리려면 'IBM Plex Mono',ui-monospace,monospace 로 바꾸고
     구글 폰트 주소를 다시 붙이면 된다. */
  --mo:'NanumSquareAc',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
/* ---------- 색상 테마 ---------- */
:root,:root[data-theme="night"]{
  --bg:#15131C; --surface:#1E1B27; --raised:#272233; --line:#332D42;
  --tx:#EFEBF5; --dim:#A29CB4; --faint:#6E687F;
  --ivory:#F3EEE4; --ink:#15131C;
  --topbg:rgba(21,19,28,.86); --promptgrad:linear-gradient(160deg,#241F33,#1B1826);
  --shadow:0 10px 34px rgba(0,0,0,.55); --shadow2:0 8px 26px rgba(0,0,0,.5);
  --joy:#F2B441; --calm:#5FC3A4; --power:#E8734F;
  --sad:#5B93DB; --mad:#DB4F65; --fear:#9B7BE0; --numb:#8E8AA0;
}
:root[data-theme="bright"]{
  --bg:#FFFFFF; --surface:#F6F7F9; --raised:#EDEFF3; --line:#DEE3EA;
  --tx:#171A21; --dim:#5B6473; --faint:#767E8C;
  --ivory:#1D2129; --ink:#FFFFFF;
  --topbg:rgba(255,255,255,.88); --promptgrad:linear-gradient(160deg,#F2F5FA,#FAFBFD);
  --shadow:0 10px 30px rgba(23,26,33,.16); --shadow2:0 8px 24px rgba(23,26,33,.14);
  --joy:#B0760D; --calm:#26866A; --power:#C04E27; --sad:#2C68B4;
  --mad:#BC2B43; --fear:#6845BC; --numb:#6A7183;
}
:root[data-theme="beige"]{
  --bg:#F7F1E6; --surface:#FDF9F1; --raised:#EFE5D4; --line:#DFD1B9;
  --tx:#3B3226; --dim:#7A6B57; --faint:#8A7A63;
  --ivory:#3B3226; --ink:#FDF9F1;
  --topbg:rgba(247,241,230,.9); --promptgrad:linear-gradient(160deg,#F1E6D2,#FBF6EC);
  --shadow:0 10px 30px rgba(59,50,38,.18); --shadow2:0 8px 24px rgba(59,50,38,.15);
  --joy:#A87410; --calm:#347F64; --power:#B84F26; --sad:#33639A;
  --mad:#B23A4C; --fear:#7050AE; --numb:#847660;
}
:root[data-theme="pink"]{
  --bg:#FFF4F6; --surface:#FFFAFB; --raised:#FBE5EB; --line:#F2CFD9;
  --tx:#3F2830; --dim:#8A6270; --faint:#9A7280;
  --ivory:#3F2830; --ink:#FFFAFB;
  --topbg:rgba(255,244,246,.9); --promptgrad:linear-gradient(160deg,#FCE4EB,#FFF6F8);
  --shadow:0 10px 30px rgba(63,40,48,.16); --shadow2:0 8px 24px rgba(63,40,48,.14);
  --joy:#AC720C; --calm:#2B836B; --power:#BC4C2A; --sad:#3062A6;
  --mad:#B92F4E; --fear:#7247B4; --numb:#8A7079;
}
:root[data-theme="green"]{
  --bg:#0E1A15; --surface:#15241F; --raised:#1D302A; --line:#2A4239;
  --tx:#E6F0EA; --dim:#9BB3A8; --faint:#6B8478;
  --ivory:#EAF3ED; --ink:#0E1A15;
  --topbg:rgba(14,26,21,.86); --promptgrad:linear-gradient(160deg,#1B302A,#132420);
  --shadow:0 10px 34px rgba(0,0,0,.5); --shadow2:0 8px 26px rgba(0,0,0,.45);
  --joy:#E8B54A; --calm:#5FD3AE; --power:#EC7B52; --sad:#5F9BD8;
  --mad:#E05A6E; --fear:#A489E4; --numb:#8FA096;
}
:root[data-theme="sand"]{
  --bg:#1A1614; --surface:#241F1B; --raised:#2F2823; --line:#3C332C;
  --tx:#F1EAE1; --dim:#AE9F90; --faint:#7E7164;
  --ivory:#F2E9DD; --ink:#1A1614;
  --topbg:rgba(26,22,20,.86); --promptgrad:linear-gradient(160deg,#2C2520,#201B18);
  --shadow:0 10px 34px rgba(0,0,0,.55); --shadow2:0 8px 26px rgba(0,0,0,.5);
  --joy:#E8B14A; --calm:#63C7A6; --power:#E5794F; --sad:#6E9BD6;
  --mad:#DC5C6E; --fear:#A488DF; --numb:#93877A;
}
:root[data-theme="indigo"]{
  --bg:#0F1622; --surface:#16202E; --raised:#1E2A3B; --line:#2A394D;
  --tx:#E7EEF7; --dim:#9AAAC0; --faint:#6C7C93;
  --ivory:#E9F0F8; --ink:#0F1622;
  --topbg:rgba(15,22,34,.86); --promptgrad:linear-gradient(160deg,#1B2739,#131C29);
  --shadow:0 10px 34px rgba(0,0,0,.55); --shadow2:0 8px 26px rgba(0,0,0,.5);
  --joy:#EFB752; --calm:#57C9BE; --power:#EC7F5C; --sad:#6FA8E8;
  --mad:#E45E77; --fear:#9E8CEA; --numb:#8894A6;
}
:root[data-theme="mist"]{
  --bg:#F3F4F6; --surface:#FFFFFF; --raised:#E7E9EC; --line:#D3D7DC;
  --tx:#15171A; --dim:#525860; --faint:#79808A;
  --ivory:#15171A; --ink:#FFFFFF;
  --topbg:rgba(243,244,246,.9); --promptgrad:linear-gradient(160deg,#EAECEF,#FAFBFC);
  --shadow:0 10px 30px rgba(21,23,26,.14); --shadow2:0 8px 24px rgba(21,23,26,.12);
  --joy:#9C6A0C; --calm:#20785F; --power:#B0461F; --sad:#265CA3;
  --mad:#AC2439; --fear:#5D3EA8; --numb:#5F666E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--ui);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  transition:background-color .28s,color .28s}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
input,textarea{background:transparent;border:0;outline:none;width:100%}
::placeholder{color:var(--faint)}
.hide{display:none !important}
.mono{font-family:var(--mo);font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
#app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative}
header.top{position:sticky;top:0;z-index:40;background:var(--topbg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) var(--sp) 10px}
.brand{font-family:var(--se);font-size:21px;font-weight:700;letter-spacing:.02em;margin-right:auto}
.brand small{font-family:var(--ui);font-weight:300;font-size:11px;color:var(--faint);
  display:block;letter-spacing:.16em;margin-top:-2px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--dim);
  transition:background .15s,color .15s}
.iconbtn:hover,.iconbtn.on{background:var(--raised);color:var(--tx)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* signature: 30일 감정 띠 */
.ribbon{display:flex;gap:2px;height:22px;padding:0 var(--sp) 10px;align-items:flex-end}
.ribbon i{flex:1;border-radius:2px;min-height:3px;background:var(--line);display:block;
  transition:height .3s}
.ribbon-lab{display:flex;justify-content:space-between;padding:0 var(--sp) 8px;
  font-size:10px;color:var(--faint);letter-spacing:.08em}

/* search */
.searchwrap{padding:0 var(--sp) 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px}
.search svg{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.8}

/* content */
main{padding:0 0 172px}
.section{padding:0 var(--sp)}
.eyebrow{font-size:10.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;
  margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}

/* prompt card */
.prompt{margin:16px var(--sp) 0;background:var(--promptgrad);
  border:1px solid var(--line);border-radius:var(--r);padding:18px}
.prompt .cat{font-size:10.5px;letter-spacing:.16em;color:var(--faint);
  display:flex;align-items:center;gap:8px}
.prompt .cat .more{margin-left:auto;color:var(--dim);letter-spacing:.04em;font-size:11px;
  border-bottom:1px solid var(--line);padding-bottom:1px}
/* 기록 화면의 확언·질문과 같은 값. 세 자리가 어긋나면 화면이 들쑥날쑥해 보인다 */
.prompt q{display:block;font-family:var(--se);font-size:16px;font-weight:600;line-height:1.45;margin:8px 0 14px;quotes:none}
.prompt .row{display:flex;gap:8px}
.btn{border-radius:10px;padding:9px 14px;font-size:13px;font-weight:500;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-p{background:var(--ivory);color:var(--ink)}
.btn-g{background:var(--raised);color:var(--dim)}
.btn-o{border:1px solid var(--line);color:var(--dim)}

/* memory card */
.memory{margin:14px var(--sp) 0;display:flex;gap:12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px}
.memory img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.memory .t{font-size:12px;color:var(--faint);letter-spacing:.04em}
.memory .b{font-size:13.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tag rail */
.rail{display:flex;gap:7px;overflow-x:auto;padding:0 var(--sp) 2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;
  color:var(--dim);white-space:nowrap;transition:.15s}
.chip.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}

/* feed grid */
.monthhead{padding:22px var(--sp) 8px;display:flex;align-items:baseline;gap:10px}
.monthhead b{font-family:var(--se);font-size:17px;font-weight:700}
.monthhead span{font-size:11px;color:var(--faint);letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surface);display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .txt{padding:9px;font-size:11px;line-height:1.5;color:var(--dim);height:100%;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.tile .d{position:absolute;left:6px;top:6px;font-size:10px;padding:2px 5px;border-radius:5px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);color:#fff;font-family:var(--mo)}
.tile .multi{position:absolute;right:6px;top:6px;width:15px;height:15px;opacity:.9}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:3px;display:flex}
.tile .bar i{flex:1}
.empty{text-align:center;padding:70px 30px;color:var(--faint)}
.empty b{display:block;font-family:var(--se);font-size:17px;font-weight:700;color:var(--dim);margin-bottom:6px}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));
  z-index:45;background:var(--ivory);color:var(--ink);height:52px;border-radius:26px;padding:0 22px;
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;
  box-shadow:var(--shadow)}
.fab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* sheets / fullscreen */
.screen{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
.screen .inner{max-width:560px;margin:0 auto;padding:0 var(--sp)
  calc(120px + env(safe-area-inset-bottom))}
.screenbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--sp) 12px;background:var(--topbg);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:0 calc(var(--sp) * -1) 0}
.screenbar .ttl{font-family:var(--se);font-size:16px;font-weight:700;margin-right:auto}

.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;
  background:rgba(0,0,0,.6);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .panel{width:100%;max-width:560px;margin:0 auto;background:var(--surface);
  border-radius:20px 20px 0 0;max-height:86dvh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);animation:up .24s cubic-bezier(.2,.8,.3,1)}
.sheet .ph{padding:16px var(--sp) 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .ph b{font-size:15px;font-weight:600;margin-right:auto}
.sheet .pb{overflow-y:auto;padding:14px var(--sp) 22px}
.grabber{width:36px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 0}

/* editor */
.field{margin-top:18px}
.label{font-size:11px;letter-spacing:.14em;color:var(--faint);margin-bottom:7px;text-transform:uppercase}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
textarea.body{min-height:260px;resize:vertical;font-size:15.5px;line-height:1.75;font-family:var(--ui)}
/* 한 줄처럼 보이는 여러 줄 칸.
   크롬은 자동완성 줄(열쇠·카드·지도)을 한 줄 입력칸에만 붙이므로,
   모양은 그대로 두고 칸 종류만 바꿔 그 줄이 뜨지 않게 한다. */
.oneline{display:block;resize:none;white-space:nowrap;overflow-x:auto;overflow-y:hidden;
  padding:0;scrollbar-width:none;font-family:var(--ui)}
.oneline::-webkit-scrollbar{display:none}
.datebtn{display:flex;align-items:center;gap:8px;font-family:var(--mo);font-size:14px;color:var(--dim)}

/* photos */
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.pthumb{position:relative;flex:none;width:92px;height:92px;border-radius:12px;overflow:hidden;
  border:1px solid var(--line)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb.cover{outline:2px solid var(--ivory);outline-offset:-2px}
.pthumb .star,.pthumb .del{position:absolute;width:24px;height:24px;border-radius:8px;display:grid;
  place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.pthumb .star{left:5px;bottom:5px}
.pthumb .del{right:5px;top:5px}
.pthumb svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2}
.pthumb.cover .star svg{fill:var(--ivory);stroke:var(--ivory)}
.padd{flex:none;width:92px;height:92px;border-radius:12px;border:1px dashed var(--line);
  display:grid;place-items:center;color:var(--faint);font-size:11px;gap:2px;text-align:center}
.padd svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;display:block;margin:0 auto 3px}
.coverhint{font-size:11.5px;color:var(--faint);margin-top:7px}

/* emotion card */
.ecard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--faint);
  border-radius:12px;padding:13px 14px;margin-bottom:10px}
.ecard .eh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ecard .eh .n{font-size:11px;letter-spacing:.14em;color:var(--faint)}
.subfield{margin-top:11px}
.subfield .sl{font-size:11.5px;color:var(--faint);margin-bottom:5px;display:flex;gap:6px;align-items:baseline}
.subfield .sl em{font-style:normal;color:#524D62;font-size:10.5px}
.selectbtn{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  background:var(--raised);display:flex;align-items:center;gap:8px;min-height:42px;flex-wrap:wrap}
.selectbtn .ph2{color:var(--faint);font-size:13.5px}
.selectbtn svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;margin-left:auto;flex:none}
.etag{font-size:12.5px;padding:3px 9px;border-radius:999px;font-weight:500}
.mini{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.addbox{width:100%;border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;transition:.15s}
.addbox:active{background:var(--surface)}
.addbox svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}

/* picker */
.tabs{display:flex;flex-shrink:0;gap:6px;overflow-x:auto;padding:12px var(--sp) 10px;scrollbar-width:none;
  border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 13px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--dim)}
.words{display:flex;flex-wrap:wrap;gap:7px}
.word{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--dim)}
.word.on{color:var(--ink);font-weight:600}

/* detail */
.affirmation{position:relative;overflow:hidden;background:var(--promptgrad);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px 11px;margin-top:14px}
.affirmation::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--calm)}
.affirmation .label{margin-bottom:3px}
.affirmation .ae{font-size:16px;font-weight:600;line-height:1.45;font-family:var(--se);color:var(--tx)}
.affirmation .ak{font-size:11px;line-height:1.4;color:var(--faint);margin-top:3px;font-family:var(--ui)}
#fAffirmation + .field{margin-top:12px}
.dphotos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--sp)*-1);
  padding:0 var(--sp);scrollbar-width:none}
.dphotos::-webkit-scrollbar{display:none}
.dphotos img{scroll-snap-align:center;width:calc(100% - 40px);flex:none;border-radius:var(--r);
  object-fit:cover;max-height:64dvh}
.dbody{font-family:var(--ui);font-size:15.5px;line-height:1.85;white-space:pre-wrap;margin-top:18px}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dtag{font-size:12.5px;color:var(--dim);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 12px}
.stat b{display:block;font-family:var(--mo);font-variant-numeric:tabular-nums;font-size:21px;font-weight:500}
.stat span{font-size:11px;color:var(--faint)}
.barrow{display:flex;align-items:center;gap:10px;margin-top:9px}
.barrow .nm{width:46px;font-size:12.5px;color:var(--dim);flex:none}
.barrow .tr{flex:1;height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
/* span 은 인라인이라 display 를 주지 않으면 width·height 가 통째로 무시된다 */
.barrow .fl{display:block;height:100%;border-radius:4px}
.barrow .ct{width:26px;text-align:right;font-family:var(--mo);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--faint)}

/* misc */
.rowitem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rowitem .rl{margin-right:auto}
.rowitem .rl b{display:block;font-size:14.5px;font-weight:500}
.rowitem .rl span{font-size:12px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--raised);
  border:1px solid var(--line);border-radius:11px;padding:10px 18px;font-size:13.5px;z-index:200;
  box-shadow:var(--shadow2);animation:fade .2s}
.lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px}
.dots{display:flex;gap:12px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.dots i.f{background:var(--ivory);border-color:var(--ivory)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:6px}
.keys button{height:62px;border-radius:50%;background:var(--surface);font-family:var(--mo);font-size:22px}
/* ---------- 사진 라이트박스 ---------- */
.lbox{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.94);display:flex;
  flex-direction:column;animation:fade .2s}
.lbox .lbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  color:#fff;flex:none}
.lbox .lbar .cnt{font-family:var(--mo);font-size:13px;opacity:.8;margin-right:auto}
.lbox .lbar .iconbtn{color:#fff}
.lbox .lbar .iconbtn:hover{background:rgba(255,255,255,.16)}
.lstage{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  align-items:center}
.lstage::-webkit-scrollbar{display:none}
.lstage img{scroll-snap-align:center;width:100%;flex:none;object-fit:contain;max-height:100%}
.ldots{display:flex;justify-content:center;gap:6px;padding:14px 0 calc(20px + env(safe-area-inset-bottom));flex:none}
.ldots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.32);transition:.2s}
.ldots i.on{background:#fff;width:18px;border-radius:3px}
.dphotos img{cursor:zoom-in}

/* ---------- 감사일기 ---------- */
.gline{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.gline .gn{flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mo);font-size:11px;background:var(--raised);color:var(--faint)}
.gline .oneline{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;font-size:14px}
.gline .gx{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}
.gline .gx svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.gadd{margin-top:2px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.gadd svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.glist{margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.glist li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;list-style:none}
.glist li span{flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mo);font-size:11px;background:var(--raised);color:var(--faint);margin-top:2px}

/* ---------- 테마 고르기 ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:9px;margin-top:12px}
.thbtn{border:1px solid var(--line);border-radius:12px;padding:11px 10px;display:flex;
  flex-direction:column;gap:8px;align-items:flex-start;transition:.15s;position:relative}
.thbtn.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx) inset}
.thbtn .sw{display:flex;gap:4px}
.thbtn .sw i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(128,128,128,.25)}
.thbtn .nm{font-size:12.5px;color:var(--dim);font-weight:500}
.thbtn.on .nm{color:var(--tx)}
.thbtn .tick{position:absolute;right:9px;top:9px;width:14px;height:14px;opacity:0}
.thbtn.on .tick{opacity:1}
.thbtn .tick svg{width:14px;height:14px;stroke:var(--tx);fill:none;stroke-width:2.6}

/* ---------- 질문 모아보기 ---------- */
.qcat{border-bottom:1px solid var(--line)}
.qcat>button{width:100%;display:flex;align-items:center;gap:9px;padding:14px 0;text-align:left}
.qcat>button b{font-size:14.5px;font-weight:500;margin-right:auto}
.qcat>button .bdg{font-family:var(--mo);font-size:11px;color:var(--ink);background:var(--ivory);
  border-radius:999px;padding:1px 7px}
.qcat>button .ar{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;transition:transform .2s}
.qcat.open>button .ar{transform:rotate(180deg)}
.qitems{padding:0 0 12px}
.qitem{width:100%;text-align:left;display:flex;gap:9px;align-items:flex-start;padding:9px 11px;
  border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.qitem .qt{flex:1;font-size:13.5px;line-height:1.55;color:var(--dim)}
.qitem.done .qt{color:var(--tx)}
.qitem .qc{flex:none;font-family:var(--mo);font-size:10.5px;color:var(--ink);background:var(--ivory);
  border-radius:999px;padding:1px 6px;margin-top:2px}
.ansitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  margin-bottom:9px;width:100%;text-align:left;display:block}
.ansitem .ad{font-family:var(--mo);font-size:11px;color:var(--faint);margin-bottom:6px}
.ansitem .at{font-size:14.5px;line-height:1.7;white-space:pre-wrap}

/* ---------- 감정카드 모아보기 ---------- */
.ccard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--faint);
  border-radius:12px;padding:13px 14px;margin-bottom:10px;width:100%;text-align:left;display:block}
.ccard .cd{font-family:var(--mo);font-size:11px;color:var(--faint);margin-bottom:7px}
.ccard .cev{font-size:14.5px;line-height:1.65;white-space:pre-wrap;margin-bottom:9px}
.ccard .cne{font-size:13px;color:var(--dim);margin-top:9px}
.ccard .ctags{display:flex;flex-wrap:wrap;gap:6px}
/* ---------- 뒤로 가기 · 종료 안내 ---------- */
.exitpop{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom));
  transform:translate(-50%,0);z-index:400;width:calc(100% - 32px);max-width:340px;
  display:flex;align-items:center;gap:12px;padding:14px 16px 15px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  animation:exitin .22s cubic-bezier(.2,.8,.3,1)}
.exitpop.out{animation:exitout .18s ease forwards}
.exitpop .eico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--raised);color:var(--dim)}
.exitpop .eico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.exitpop b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.exitpop span{display:block;margin-top:3px;font-size:12px;color:var(--faint);line-height:1.45}
.exitpop .ebar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ivory);
  opacity:.45;transform-origin:left;animation:edrain 2s linear forwards}
@keyframes exitin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes exitout{to{opacity:0;transform:translate(-50%,10px)}}
@keyframes edrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* ---------- 하단 탭 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--topbg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{position:relative;flex:1;height:58px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;
  letter-spacing:.04em;transition:color .15s}
.tabbar button.on{color:var(--tx)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar .bdg{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--mad);color:#fff;font-family:var(--mo);font-size:10px;
  display:grid;place-items:center;font-style:normal}

/* ---------- 루틴 신호등 ---------- */
.light{margin:16px var(--sp) 0;background:var(--promptgrad);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 18px}
.light .lh{display:flex;align-items:center;gap:11px}
.light .lamp{flex:none;display:flex;gap:5px}
.light .lamp i{width:13px;height:13px;border-radius:50%;background:var(--raised);
  border:1px solid var(--line);transition:.25s}
.light .lab{font-size:10.5px;letter-spacing:.16em;color:var(--faint)}
.light .pct{font-family:var(--mo);font-variant-numeric:tabular-nums;font-size:25px;font-weight:500;margin-left:auto;line-height:1}
.light .pct small{font-size:12px;color:var(--faint);margin-left:2px}
.light .tr{height:8px;border-radius:4px;background:var(--raised);overflow:hidden;margin-top:13px}
.light .tr .fl{display:block;height:100%;border-radius:4px;transition:width .3s}
.light .msg{font-size:12.5px;color:var(--dim);margin-top:10px}

/* ---------- 루틴 목록 ---------- */
/* ---------- 루틴 탭의 주간 날짜 바 ---------- */
.wkbar{display:flex;align-items:center;gap:4px;margin:14px var(--sp) 0}
.wkbar .nav{flex:none;width:26px;height:46px;border-radius:9px;display:grid;place-items:center;color:var(--faint)}
.wkbar .nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.wkdays{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wkday{border-radius:12px;padding:7px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--faint);font-size:10px;letter-spacing:.02em;transition:background .15s}
.wkday b{font-family:var(--mo);font-size:14px;font-weight:500;color:var(--dim);line-height:1.2}
.wkday .pip{width:6px;height:6px;border-radius:50%;background:var(--line)}
.wkday.later{opacity:.5}
.wkday.today b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.wkday.sel{background:var(--ivory);color:var(--ink)}
.wkday.sel b{color:var(--ink)}
.daynote{width:100%;margin:10px 0 0;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;
  color:var(--dim);font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.daynote b{font-weight:600;color:var(--tx)}
.daynote:active{background:var(--surface)}

/* 목록 머리: 왼쪽 이름표 + 오른쪽 정렬 단추 */
.rbar{display:flex;align-items:center;gap:8px;margin:22px var(--sp) 10px}
.rbar .lb{font-size:10.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.rbar .sortbtn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.rbar .sortbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.rlist{margin:0 var(--sp)}
/* 루틴 이름 앞에 붙는 시간대 칸 */
.ritem .slot{flex:none;width:62px;font-size:10.5px;line-height:1.35;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.ritem.done .slot,.ritem.rest .slot{opacity:.6}

.ritem{display:flex;align-items:center;gap:9px;padding:11px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px;transition:background .15s,border-color .15s}
.ritem .ck{flex:none;width:27px;height:27px;border-radius:9px;border:1.5px solid var(--line);
  display:grid;place-items:center;color:transparent;transition:.18s}
.ritem .ck svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.8}
.ritem.done .ck{background:var(--calm);border-color:var(--calm);color:var(--ink)}
.ritem.rest .ck{background:var(--fear);border-color:var(--fear);color:var(--ink)}
.ritem .em{flex:none;width:22px;text-align:center;font-size:17px;line-height:1}
.ritem .nm{flex:1;min-width:0;font-size:14.5px;text-align:left}
.ritem.done .nm,.ritem.rest .nm{color:var(--dim)}
.ritem.done .nm .t{text-decoration:line-through;text-decoration-color:var(--faint)}
.ritem .memo{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .opt{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.ritem .opt svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
/* 루틴 묶음 — 결이 같은 루틴을 옅은 색 판 위에 모아 눈으로 바로 가르게 한다.
   색은 --gc 로 받아 배경(11%)과 왼쪽 띠에만 쓴다. 글자까지 물들이면 읽기 힘들어진다. */
.gwrap{background:var(--surface);border:1px solid var(--line);
  background:color-mix(in srgb, var(--gc) 11%, transparent);
  border:1px solid color-mix(in srgb, var(--gc) 26%, transparent);
  border-radius:14px;padding:9px 9px 1px;margin-bottom:10px}
.gwrap .ritem{background:var(--bg);margin-bottom:8px}
.ghead{width:100%;display:flex;align-items:center;gap:8px;padding:3px 3px 9px;text-align:left}
.ghead .ar{flex:none;width:16px;height:16px;stroke:var(--gc);fill:none;stroke-width:2.4;
  transition:transform .18s}
.ghead .ar.closed{transform:rotate(-90deg)}
.ghead .gn{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .gc{flex:none;font-family:var(--mo);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--faint)}
/* 접었을 때 — 줄은 지우지 않고 감추기만 해서 다시 펴면 그대로 돌아온다 */
.gbody.fold{display:none}
.ghead.plain{padding:12px 3px 8px}
.ghead.plain .gn{color:var(--faint);font-weight:500;letter-spacing:.04em}

/* 창 위에 붙박은 이름 칸 — 아래 목록만 스크롤되고 이 줄은 그대로 남는다 */
.sheet .gnamebar{padding:12px var(--sp);border-bottom:1px solid var(--line);background:var(--surface);flex:none}
/* 다른 묶음에 담겨 있다는 안내 — 경고는 아니라서 흐린 강조 정도로만 */
:root{--gcnote:#C9A227}

/* 할 일 — 그날 하루만 사는 항목이라 시간대 칸을 다른 색으로 물들여 구분한다 */
.ritem.todo{border-style:dashed}
.ritem.todo .slot{color:var(--power);font-weight:600;letter-spacing:.02em}
.ritem.doing .ck{background:var(--joy);border-color:var(--joy);color:var(--ink)}
.ritem.doing .ck svg{fill:currentColor;stroke:none}
.ritem.doing .nm{color:var(--dim)}
.addtodo{width:100%;margin-top:2px;border:1px dashed var(--line);border-radius:12px;padding:12px;
  color:var(--dim);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px}
.addtodo:active{background:var(--surface)}
.addtodo svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.tdrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tdrow .tn{flex:1;min-width:0;font-size:14px}
.tdrow .tx{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.tdrow .tx svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- 루틴 관리 ---------- */
.rmg{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.rmg .em{flex:none;width:26px;text-align:center;font-size:17px}
.rmg .bd{flex:1;min-width:0}
.rmg .bd b{display:block;font-size:14.5px;font-weight:500}
.rmg .bd span{font-size:11.5px;color:var(--faint)}
.rmg.off .bd b,.rmg.off .em{opacity:.45}
.rmg .mv{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.rmg .mv svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.rmg .mv[disabled]{opacity:.25}

/* ---------- 신호등 기준 고르기 ---------- */
.lchips{display:flex;gap:8px;margin-bottom:6px}
.lchip{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;
  font-size:11.5px;color:var(--faint)}
.lchip i{display:block;width:13px;height:13px;border-radius:50%;margin:0 auto 8px}
.lchip b{display:block;font-family:var(--mo);font-size:12.5px;font-weight:500;margin-top:5px;color:var(--tx)}
.step{display:flex;align-items:center;gap:5px;flex:none}
.step button{width:31px;height:31px;border-radius:9px;background:var(--raised);color:var(--dim);
  font-size:17px;line-height:1;display:grid;place-items:center}
.step button:disabled{opacity:.3}
.step b{min-width:48px;text-align:center;font-family:var(--mo);font-size:14px;font-weight:500}

/* ---------- 달력 ---------- */
.calnav{display:flex;align-items:center;gap:8px;margin-top:14px}
.calnav b{font-family:var(--se);font-size:17px;font-weight:700;margin-right:auto}
.calnav button{width:33px;height:33px;border-radius:10px;background:var(--raised);color:var(--dim);
  display:grid;place-items:center;flex:none}
.calnav button:disabled{opacity:.3}
.calnav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.calnav .tdy{width:auto;padding:0 12px;font-size:12px;font-family:var(--ui)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal .dw{text-align:center;font-size:10px;color:var(--faint);padding-bottom:2px}
.cday{position:relative;aspect-ratio:1;border-radius:9px;background:var(--raised);overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-family:var(--mo);font-size:12.5px;
  color:var(--faint);transition:transform .12s}
.cday:active{transform:scale(.94)}
.cday.blank{background:none;pointer-events:none}
.cday.later{opacity:.3;pointer-events:none}
.cday.lit{color:var(--tx)}
.cday.today{outline:1.5px solid var(--tx);outline-offset:-1.5px;font-weight:700;color:var(--tx)}
.cday .bar{position:absolute;left:0;right:0;bottom:0;height:3.5px;display:flex}
.cday .bar i{flex:1}
.calleg{display:flex;flex-wrap:wrap;align-items:center;gap:7px 13px;margin-top:12px;
  font-size:11px;color:var(--faint)}
.calleg span{display:flex;align-items:center;gap:5px}
.calleg i{width:11px;height:11px;border-radius:3px;display:block}
.calleg i.b{height:4px;width:15px;border-radius:2px;background:var(--calm)}

/* ---------- 하루 돌아보기 ---------- */
.dayhead{margin:18px 0 4px;display:flex;align-items:center;gap:10px}
.dayhead .dl{font-family:var(--se);font-size:19px;font-weight:700;margin-right:auto}
.dayhead .dp{font-family:var(--mo);font-variant-numeric:tabular-nums;font-size:13px;padding:3px 10px;border-radius:999px}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">

  ["02-25","일과 자신감","완성하지 못한 것도 만들어 본 것이다.","What I did not finish, I still made."],
  ["02-26","평온과 현재","나는 답을 재촉하지 않고 시간에게 맡긴다.","I stop pressing for the answer and leave it to time."],
  ["02-27","몸과 쉼","나는 몸을 성능이 아니라 삶의 자리로 대한다.","I treat my body as a home, not as a machine."],
  ["02-28","변화와 미래","끝이 보이지 않는 길에도 다음 한 걸음은 늘 보인다.","Even when the road's end is hidden, the next step is visible."],
  ["02-29","사랑과 소속","나는 혼자 있어도 혼자가 아니다.","Being alone is not being without anyone."],
  ["03-01","성장과 배움","성장은 직선이 아니라 나선이다. 같은 자리를 다른 높이에서 지난다.","Growth is a spiral, not a line; I pass the same place at a new height."],
  ["03-02","용기와 회복","상처가 아무는 동안에도 나는 살아 있다.","I am alive even while the wound is closing."],
  ["03-03","진정성과 의미","아무도 보지 않을 때의 내가 진짜 나다.","Who I am unobserved is who I am."],
  ["03-04","변화와 미래","익숙한 불행보다 낯선 가능성을 택할 수 있다.","I can choose an unfamiliar possibility over a familiar unhappiness."],
  ["03-05","자기 친절","오늘의 나에게 필요한 것은 채찍이 아니라 물 한 잔이다.","What today's me needs is a glass of water, not a whip."],
  ["03-06","용기와 회복","나는 넘어진 횟수가 아니라 일어난 방향으로 나를 기억한다.","I remember myself by the direction I rose, not the number of falls."],
  ["03-07","자기 신뢰","내가 내린 결정을 나는 끝까지 데리고 간다.","I carry my own decisions through to the end."],
  ["03-08","사랑과 소속","사랑은 소유가 아니라 곁에 있기로 하는 선택이다.","Love is not possession but the choice to stay near."],
  ["03-09","진정성과 의미","나는 내 삶에서 무엇이 중요한지 스스로 정한다.","I decide for myself what matters in my life."],
  ["03-10","관계와 경계","상대의 침묵을 내 잘못으로 번역하지 않는다.","I do not translate someone's silence into my fault."],
  ["03-11","몸과 쉼","오늘 하루 숨 쉬어 준 몸에게 고맙다.","I thank the body that breathed for me today."],
  ["03-12","사랑과 소속","받은 다정함은 갚을 곳이 없어 다음 사람에게 간다.","Kindness received has nowhere to be repaid, so it moves on to the next person."],
  ["03-13","감사와 기쁨","감사는 부족함을 부정하지 않고도 가능하다.","Gratitude is possible without denying what is missing."],
  ["03-14","평온과 현재","고요는 아무 일도 없는 상태가 아니라 흔들려도 돌아오는 힘이다.","Calm is not the absence of trouble but the power to return."],
  ["03-15","일과 자신감","나는 모른다고 말할 수 있을 만큼 자신 있다.","I am confident enough to say that I do not know."],
  ["03-16","몸과 쉼","나는 나를 몰아붙이지 않고 데리고 간다.","I lead myself along instead of driving myself."],
  ["03-17","일과 자신감","실력은 조용히 쌓이다가 어느 날 드러난다.","Skill gathers quietly and shows itself all at once."],
  ["03-18","감사와 기쁨","나에게 온 좋은 일을 나는 운이라고 낮추지 않는다.","I do not dismiss my good fortune as mere luck."],
  ["03-19","성장과 배움","한 번 해낸 일보다 열 번 다시 한 일이 나를 만든다.","What shapes me is the thing done ten times over, not the thing done once."],
  ["03-20","평온과 현재","지금 이 순간 나는 안전하다.","In this moment I am safe."],
  ["03-21","용기와 회복","견디는 것과 참는 것은 다르다. 나는 견디되 참지 않는다.","Enduring and suppressing are not the same; I endure without swallowing."],
  ["03-22","자기 친절","내가 나를 알아주지 않으면 그 일은 아무 일도 아닌 것이 된다.","If I never credit myself, what I did becomes nothing at all."],
  ["03-23","자기 신뢰","나는 나를 의심하는 날에도 나를 버리지 않는다.","Even on the days I doubt myself, I do not abandon myself."],
  ["03-24","관계와 경계","나를 소모시키는 관계에서 나는 걸어 나올 수 있다.","I can walk out of what drains me."],
  ["03-25","변화와 미래","계절이 바뀌듯 내 삶에도 바뀌는 시기가 있다.","My life has its turning seasons, just as the year does."],
  ["03-26","관계와 경계","좋은 관계는 서로를 바꾸지 않고도 편안하다.","A good relationship is easy without remaking either person."],
  ["03-27","감사와 기쁨","지나간 좋은 날들은 아직 내 안에 있다.","The good days that passed are still inside me."],
  ["03-28","일과 자신감","나는 나의 노력을 내가 먼저 알아준다.","I am the first to acknowledge my own effort."],
  ["03-29","평온과 현재","나는 생각을 사실로 착각하지 않는다.","I do not mistake a thought for a fact."],
  ["03-30","사랑과 소속","나를 온전히 아는 사람이 하나만 있어도 충분하다.","One person who truly knows me is enough."],
  ["03-31","자기 친절","나에게 다정한 날이 남에게도 다정한 날이 된다.","A day I am kind to myself becomes a day I am kind to others."],
  ["04-01","몸과 쉼","잠은 하루를 지우는 것이 아니라 정리하는 시간이다.","Sleep does not erase the day; it puts it in order."],
  ["04-02","평온과 현재","오늘 할 수 있는 만큼이 오늘의 전부다.","What I can do today is all of today."],
  ["04-03","용기와 회복","지나간 폭풍은 내 안에 항해술을 남겼다.","The storms that passed left their seamanship in me."],
  ["04-04","변화와 미래","오늘 심은 것이 오늘 자라지 않아도 나는 심는다.","I plant even when nothing sprouts the same day."],
  ["04-05","자기 친절","나는 나를 용서하는 데 허락을 구하지 않는다.","I need no one's permission to forgive myself."],
  ["04-06","일과 자신감","일이 나의 전부가 아니어도 나는 성실할 수 있다.","Work need not be all of me for me to do it well."],
  ["04-07","감사와 기쁨","나는 나를 스쳐 간 다정함을 잊지 않는다.","I do not forget the kindness that passed my way."],
  ["04-08","용기와 회복","나는 최악을 상상할 수 있는 만큼 최선도 상상할 수 있다.","I can imagine the best as vividly as I imagine the worst."],
  ["04-09","진정성과 의미","하고 싶은 일과 해야 하는 일 사이에서 나는 매일 저울질한다. 그것이 삶이다.","Each day I weigh want against must, and that weighing is the life."],
  ["04-10","변화와 미래","나는 계획을 사랑하되 계획에 갇히지 않는다.","I love my plans without living inside them."],
  ["04-11","변화와 미래","무엇을 그만둘지 정하는 것도 미래를 정하는 일이다.","Deciding what to stop is also deciding the future."],
  ["04-12","자기 친절","게으른 날의 나도 나다.","The lazy version of me is also me."],
  ["04-13","진정성과 의미","가면을 오래 쓰면 얼굴이 잊힌다.","Wear a mask long enough and the face is forgotten."],
  ["04-14","성장과 배움","질문을 바꾸면 보이는 것이 달라진다.","Change the question and what I see changes."],
  ["04-15","평온과 현재","생각으로 생각을 이길 수는 없다.","Thought cannot be defeated by more thought."],
  ["04-16","일과 자신감","나는 비교 대신 관찰한다.","Instead of comparing, I observe."],
  ["04-17","사랑과 소속","사랑은 준 사람의 방식이 아니라 받은 사람의 언어로 도착한다.","Love arrives in the receiver's language, not the giver's."],
  ["04-18","감사와 기쁨","오늘 무사히 지나간 하루도 감사한 일이다.","A day that passed without harm is also something to be thankful for."],
  ["04-19","평온과 현재","걱정은 문제를 풀지 못하고 오늘만 가져간다.","Worry solves nothing and takes today with it."],
  ["04-20","자기 친절","나는 나를 평가하는 대신 알아준다.","Instead of judging myself, I notice myself."],
  ["04-21","자기 신뢰","조언은 참고이지 명령이 아니다.","Advice is a reference, not an order."],
  ["04-22","몸과 쉼","나는 배고픔과 배부름을 믿는다.","I trust my hunger and my fullness."],
  ["04-23","자기 신뢰","나는 내 마음이 아니라고 할 때 그것을 믿는다.","When something in me says no, I believe it."],
  ["04-24","관계와 경계","기대를 말하지 않으면 서운함만 남는다.","Expectations left unspoken leave only disappointment."],
  ["04-25","사랑과 소속","서로 다른 사랑의 언어를 배우는 일이 관계다.","A relationship is learning each other's language of love."],
  ["04-26","성장과 배움","잘하는 일만 하면 잘하는 일만 남는다.","If I only do what I am good at, that is all I will ever have."],
  ["04-27","관계와 경계","나는 내 시간을 선물처럼 여긴다. 아무에게나 주지 않는다.","I treat my time as a gift and do not hand it to just anyone."],
  ["04-28","몸과 쉼","몸을 움직이면 마음도 자리를 옮긴다.","When the body moves, the mind moves too."],
  ["04-29","일과 자신감","잘 해내지 못한 날에도 자리를 지킨 나를 인정한다.","Even on the days I fell short, I showed up."],
  ["04-30","감사와 기쁨","나는 기쁨을 나중으로 미루지 않는다.","I do not postpone joy."],
  ["05-01","자기 신뢰","나를 여기까지 데려온 것은 남의 조언이 아니라 나의 결정들이다.","What brought me here was my own decisions, not anyone's advice."],
  ["05-02","자기 신뢰","나는 실수해도 나를 신뢰할 수 있다.","I can trust myself even when I get it wrong."],
  ["05-03","변화와 미래","나는 지금 이 자리에서 방향을 바꿀 수 있다.","I can change direction from exactly where I stand."],
  ["05-04","사랑과 소속","나는 사랑에 서툴러도 사랑할 자격이 있다.","I am clumsy at love and still worthy of it."],
  ["05-05","용기와 회복","물러서는 것도 나아가는 방법 중 하나다.","Stepping back is also a way of moving forward."],
  ["05-06","자기 친절","잘 못한 하루가 잘못된 사람을 만들지 않는다.","A day done badly does not make a bad person."],
  ["05-07","일과 자신감","나는 내 몫을 하고 남의 몫은 남긴다.","I do my share and leave the rest to others."],
  ["05-08","평온과 현재","나는 한 번에 한 가지만 하는 사치를 나에게 허락한다.","I grant myself the luxury of one thing at a time."],
  ["05-09","성장과 배움","어설픈 첫 시도가 완벽한 계획보다 멀리 간다.","A clumsy first attempt travels farther than a perfect plan."],
  ["05-10","평온과 현재","지나간 일은 이미 나를 통과했다.","What is past has already passed through me."],
  ["05-11","자기 신뢰","확신은 시작할 때가 아니라 하다 보면 생긴다.","Certainty comes from doing, not before it."],
  ["05-12","사랑과 소속","누군가에게 짐이 되는 순간에도 나는 사랑받는다.","Even in the moments I am a burden, I am loved."],
  ["05-13","몸과 쉼","나는 아픈 나를 미워하지 않는다.","I do not resent myself for being unwell."],
  ["05-14","진정성과 의미","나는 부끄러운 마음도 나의 일부로 데리고 산다.","I live with my shame as a part of me."],
  ["05-15","감사와 기쁨","좋은 것을 좋다고 느끼는 능력도 연습으로 자란다.","The ability to feel good things also grows with practice."],
  ["05-16","진정성과 의미","진심은 대개 조용하다.","Sincerity is usually quiet."],
  ["05-17","관계와 경계","사과할 일과 사과하지 않을 일을 나는 구분한다.","I know what to apologize for and what not to."],
  ["05-18","평온과 현재","조급함을 내려놓으면 시야가 넓어진다.","Setting down haste widens the view."],
  ["05-19","몸과 쉼","회복에는 시간이 걸리고, 그 시간도 삶이다.","Healing takes time, and that time is also life."],
  ["05-20","감사와 기쁨","지금의 나는 지난 나들이 모아서 여기로 보낸 사람이다.","Who I am now was gathered up and sent here by all the versions of me before."],
  ["05-21","자기 친절","나는 나의 속도를 사과하지 않는다.","I do not apologize for my pace."],
  ["05-22","성장과 배움","나는 배운 것을 잊을 자유도 있다.","I am free to unlearn as well."],
  ["05-23","자기 친절","스스로에게 하는 말은 결국 내가 사는 집이 된다.","What I say to myself becomes the house I live in."],
  ["05-24","감사와 기쁨","슬픔이 있다고 기쁨이 사라지는 것은 아니다.","Sorrow does not cancel joy."],
  ["05-25","변화와 미래","문이 닫히는 소리를 나는 끝이라고 부르지 않는다.","I do not call the sound of a closing door an ending."],
  ["05-26","관계와 경계","상대를 이해하는 것과 다 받아주는 것은 다르다.","Understanding someone is not the same as allowing everything."],
  ["05-27","관계와 경계","누군가의 화는 그 사람의 것이다.","Another person's anger belongs to them."],
  ["05-28","용기와 회복","나는 부서지지 않기 위해서가 아니라 살기 위해 단단해진다.","I grow strong in order to live, not to avoid breaking."],
  ["05-29","일과 자신감","인정받지 못한 일도 사라지지 않는다.","Work that goes unrecognized does not disappear."],
  ["05-30","변화와 미래","나는 기다림도 하나의 준비로 여긴다.","I count waiting as a form of preparing."],
  ["05-31","진정성과 의미","나는 좋아하는 것을 좋아한다고 말할 수 있다.","I can say plainly that I like what I like."],
  ["06-01","평온과 현재","나는 아무것도 하지 않는 시간에 죄책감을 붙이지 않는다.","I attach no guilt to time spent doing nothing."],
  ["06-02","감사와 기쁨","나는 작은 즐거움을 죄스러워하지 않는다.","I feel no guilt over small pleasures."],
  ["06-03","몸과 쉼","나는 몸의 변화를 늙음이 아니라 함께 살아온 흔적으로 본다.","I read my body's changes as traces of a life shared, not as decline."],
  ["06-04","관계와 경계","주기만 하는 관계는 결국 한쪽이 지쳐 끝난다.","A bond where only one gives ends when that one tires."],
  ["06-05","자기 친절","남을 챙기고 남은 것으로 나를 챙기면 늘 모자란다.","If I tend to myself with what is left over, there is never enough."],
  ["06-06","사랑과 소속","나는 내가 속할 자리를 스스로 만들 수 있다.","I can build the place where I belong."],
  ["06-07","몸과 쉼","오늘의 컨디션이 나의 가치를 말하지 않는다.","How I feel today does not measure my worth."],
  ["06-08","자기 신뢰","나는 내 삶의 결정권을 남에게 넘기지 않는다.","I do not hand over the say in my own life."],
  ["06-09","용기와 회복","오늘 감당한 만큼이 내가 감당할 수 있는 크기다.","What I carried today is the measure of what I can carry."],
  ["06-10","감사와 기쁨","매일 같은 풍경도 매일 다른 빛을 받는다.","The same view takes a different light each day."],
  ["06-11","용기와 회복","무서운 일을 하고 나면 무섭던 크기가 줄어든다.","After I do the frightening thing, the fright grows smaller."],
  ["06-12","일과 자신감","도움을 청하는 사람을 나는 약하다고 여기지 않는다. 나부터 그렇다.","I do not think less of those who ask for help, beginning with myself."],
  ["06-13","평온과 현재","마음이 흐린 날에도 해는 그 자리에 있다.","On overcast days the sun is still where it was."],
  ["06-14","사랑과 소속","마음을 여는 일에는 늘 위험이 따르고, 그래도 나는 연다.","Opening my heart always carries risk, and I open it anyway."],
  ["06-15","진정성과 의미","남이 나를 어떻게 부르든 나는 내 이름을 안다.","Whatever others call me, I know my name."],
  ["06-16","변화와 미래","사라진 것들이 자리를 비워 새것이 들어온다.","What disappears makes room for what arrives."],
  ["06-17","관계와 경계","관계의 거리는 조절할 수 있다. 끊는 것만이 답은 아니다.","Distance can be adjusted; cutting off is not the only answer."],
  ["06-18","자기 친절","오늘 하루를 견딘 나를 안아준다.","I hold the me who got through today."],
  ["06-19","몸과 쉼","몸을 돌보는 일은 대단한 결심이 아니라 사소한 반복이다.","Caring for the body is small repetition, not grand resolve."],
  ["06-20","용기와 회복","나는 나를 무너뜨린 말보다 오래 산다.","I outlive the words that broke me."],
  ["06-21","진정성과 의미","내가 쓰는 시간이 내가 믿는 것을 보여 준다.","How I spend my time shows what I believe."],

/* ---------- 저장소: Claude 아티팩트에서는 window.storage, 배포 시엔 IndexedDB ---------- */
const KV = (() => {
  if (typeof window !== 'undefined' && window.storage && window.storage.get) {
    const P = window.storage;
    return {
      mode: 'artifact',
      async get(k) { try { const r = await P.get(k, false); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } },
      async set(k, v) { await P.set(k, JSON.stringify(v), false); },
      async del(k) { try { await P.delete(k, false); } catch (e) { } },
      async keys(p) { try { const r = await P.list(p, false); return (r && r.keys || []).map(x => typeof x === 'string' ? x : x.key); } catch (e) { return []; } }
    };
  }
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('maeumgyeol', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const d = await db();
    return new Promise((res, rej) => {
      const req = fn(d.transaction('kv', mode).objectStore('kv'));
      req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
    });
  };
  return {
    mode: 'idb',
    async get(k) { const v = await tx('readonly', s => s.get(k)); return v === undefined ? null : v; },
    async set(k, v) { await tx('readwrite', s => s.put(v, k)); },
    async del(k) { await tx('readwrite', s => s.delete(k)); },
    async keys(p) { const all = await tx('readonly', s => s.getAllKeys()); return all.filter(k => !p || String(k).startsWith(p)); }
  };
})();

let _colorCache = {};
function famColor(id) {
  if (_colorCache[id]) return _colorCache[id];

function gradOf(fams) {

  return `linear-gradient(150deg,${c.map(x => x + '30').join(',')})`;
}

async function shrink(file, max, quality) {
  let bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => {
      const i = new Image(), u = URL.createObjectURL(file);
      i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u;
    });
  }
  const w = bmp.width, h = bmp.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1E1B27'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return c.toDataURL('image/jpeg', quality);
}

    tags: entry.tags, photos: entry.photos.length, cover: cover ? cover.id : '',
    emos: entry.cards.flatMap(c => c.emotions),
    fams: [...new Set(entry.cards.flatMap(c => c.emotions.map(famOf)))],
    pq: (entry.prompt && entry.prompt.a && entry.prompt.a.trim()) ? entry.prompt.q : '',
    grat: grat.length
  };
  await KV.set(K.entry(entry.id), entry);
  if (thumb !== undefined) {
    const bucket = S.thumbs[ym] || (S.thumbs[ym] = {});
    if (thumb) bucket[entry.id] = thumb; else delete bucket[entry.id];
    await KV.set(K.thumb(ym), bucket);
  }
  const i = S.index.findIndex(x => x.id === entry.id);
  if (i >= 0) S.index[i] = meta; else S.index.push(meta);
  await saveIndex();
}
async function deleteEntry(id) {
  const m = S.index.find(x => x.id === id); if (!m) return;
  const ym = m.date.slice(0, 7);
  await KV.del(K.entry(id));
  if (S.thumbs[ym]) { delete S.thumbs[ym][id]; await KV.set(K.thumb(ym), S.thumbs[ym]); }
  S.index = S.index.filter(x => x.id !== id);
  await saveIndex();
}

/* ---------- 오늘의 질문 (하루 하나, 1년간 중복 없음) ---------- */
function todaysPrompt(dateStr, offset = 0) {
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear();
  const doy = Math.floor((d - new Date(year, 0, 0)) / 864e5);
  let seed = year * 7919 % 233280;
  const order = PROMPTS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    seed = (seed * 9301 + 49297) % 233280;
    const j = Math.floor(seed / 233280 * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return PROMPTS[order[(doy + offset) % PROMPTS.length]];
}

/* 기록 날짜의 월·일에 지정된 확언을 골라, 해가 바뀌어도 같은 날짜에는 같은 문장을 보여준다. */
const AFFIRMATION_BY_DATE = Object.fromEntries(
  AFFIRMATIONS.map(([dateKey, , ko, en]) => [dateKey, [ko, en]])
);
function affirmationFor(dateStr) {
  const m = /^\d{4}-(\d{2}-\d{2})$/.exec(dateStr || '');
  return AFFIRMATION_BY_DATE[m ? m[1] : '01-01'] || AFFIRMATION_BY_DATE['01-01'];
}

function affirmationHtml(dateStr) {
  const [ko, en] = affirmationFor(dateStr);
  return `<div class="affirmation" aria-label="오늘의 확언">
    <div class="label">오늘의 확언</div>
    <div class="ae" lang="en">${esc(en)}</div>
    <div class="ak">${esc(ko)}</div>
  </div>`;
}

/* ============================================================
   루틴 — 매일 지킬 것을 적어두고 체크한다
   저장: 정의는 md:routines 한 덩어리, 체크는 md:check:YYYY-MM 로 달마다
   ============================================================ */
const saveRoutines = () => KV.set(K.rt, S.routines);
const saveGroups = () => KV.set(K.grp, S.groups);

/* ---------- 루틴 묶음 ---------- */
const sortedGroups = () => [...S.groups].sort((a, b) => (a.order || 0) - (b.order || 0));
const groupById = id => S.groups.find(g => g.id === id) || null;

/* 목록을 묶음별로 갈라 놓는다. 어느 묶음에도 안 든 루틴은 맨 끝 '묶지 않음' 칸으로 간다.
   묶음이 하나도 없으면 예전처럼 한 덩어리로 보여 준다. */
function groupRoutines(list) {
  if (!S.groups.length) return [{ group: null, items: sortRoutines(list) }];
  const out = [];
  for (const g of sortedGroups()) {
    const items = list.filter(r => r.gid === g.id);
    if (items.length) out.push({ group: g, items: sortRoutines(items) });
  }
  const rest = list.filter(r => !r.gid || !groupById(r.gid));
  if (rest.length) out.push({ group: null, items: sortRoutines(rest) });
  return out;
}

/* 접은 상태는 묶음에 적어 두고 저장한다 — 앱을 다시 열어도 접어 둔 대로 보이도록 */
async function toggleGroupFold(gid) {
  const g = groupById(gid); if (!g) return;
  g.fold = !g.fold;
  await saveGroups();
  renderRoutine();
}
const saveSlots = () => KV.set(K.slot, S.slots);

/* 기본 시간대 + 직접 만든 시간대.
   직접 만든 것은 저녁 뒤, '아무 때나' 앞에 만든 순서대로 들어간다 */
function allSlots() {
  const i = SLOTS.findIndex(s => s.id === 'any');
  return [...SLOTS.slice(0, i), ...S.slots, ...SLOTS.slice(i)];
}
const findSlot = id => allSlots().find(s => s.id === id);
const anySlot = () => SLOTS.find(s => s.id === 'any');
const slotName = id => (findSlot(id) || anySlot()).name;

function dayChecks(date) { return (S.checks[date.slice(0, 7)] || {})[date] || {}; }

async function setCheck(date, rid, val) {
  const ym = date.slice(0, 7);
  const bucket = S.checks[ym] || (S.checks[ym] = {});
  const day = bucket[date] || (bucket[date] = {});
  if (val) day[rid] = val; else delete day[rid];
  if (!Object.keys(day).length) delete bucket[date];
  await KV.set(K.check(ym), bucket);
}

/* 그날 예정된 루틴.
   보관한 루틴도 보관 전 날짜에는 그대로 세어야 지난 통계가 흔들리지 않는다. */
function routinesOn(date) {
  const dow = new Date(date + 'T00:00:00').getDay();
  return S.routines
    .filter(r => (r.days || []).includes(dow)
      && (!r.startDate || r.startDate <= date)
      && (r.active !== false || (r.archivedDate && date < r.archivedDate)))
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

/* 반만 친 것으로 세는 무게.
   루틴의 '오늘은 쉼' 과 할 일의 '진행 중' 이 여기에 해당한다. */
const REST_WEIGHT = .5;

/* ---------- 할 일 — 그날 하루만 사는 일회성 항목 ---------- */
function dayTodos(date) { return (S.todos[date.slice(0, 7)] || {})[date] || []; }

async function saveTodos(date, list) {
  const ym = date.slice(0, 7);
  const bucket = S.todos[ym] || (S.todos[ym] = {});
  if (list.length) bucket[date] = list; else delete bucket[date];
  await KV.set(K.todo(ym), bucket);
}

/* 그날의 달성률.
   분모는 그날 예정된 루틴에 그날 더한 할 일을 합친 전체.
   완료는 1, 루틴의 '쉼' 과 할 일의 '진행 중' 은 그 절반으로 센다. */
function dayProgress(date) {
  const list = routinesOn(date), ck = dayChecks(date);
  let done = 0, rest = 0;
  for (const r of list) {
    const s = (ck[r.id] || {}).s;
    if (s === 'done') done++; else if (s === 'rest') rest++;
  }
  const todos = dayTodos(date);
  let tdone = 0, doing = 0;
  for (const t of todos) {
    if (t.s === 'done') tdone++; else if (t.s === 'doing') doing++;
  }
  const target = list.length + todos.length;                  /* 분모 */
  const credit = done + tdone + (rest + doing) * REST_WEIGHT; /* 완료 1, 쉼·진행 중 0.5 */
  /* 아직 끝내지 않은 것. 쉼은 정리한 것으로 보지만 진행 중은 남은 쪽에 센다 */
  const left = (list.length - done - rest) + (todos.length - tdone);
  const rate = target > 0 ? credit / target : -1;
  return { list, ck, todos, done, rest, tdone, doing, left, credit, target, total: target, rate };
}

function lightOf(rate) {
  const t = S.settings.light || LIGHT_DEFAULT;
  const pct = rate * 100;
  if (rate < 0) return { i: -1, color: 'var(--faint)', msg: '오늘은 예정된 루틴이 없어요' };
  if (pct >= t.green) return { i: 2, color: famColor('calm'), msg: '오늘 흐름이 좋아요' };
  if (pct >= t.yellow) return { i: 1, color: famColor('joy'), msg: '절반쯤 왔어요. 남은 건 천천히' };
  return { i: 0, color: famColor('mad'), msg: '하나만 해봐도 충분해요' };
}

/* 최근 30일 달성 띠 — 감정 띠와 같은 자리, 같은 모양 */
function renderRoutineRibbon() {
  const el = $('#ribbon'), today = new Date(), parts = [];

    const L = lightOf(p.rate);
    const h = 7 + Math.round(p.rate * 15);
    parts.push(`<i title="${key} · ${Math.round(p.rate * 100)}%" style="height:${h}px;background:${L.color}"></i>`);
  }
  el.innerHTML = parts.join('');
  $('.ribbon-lab span').textContent = '최근 30일의 루틴';
  $('#ribbonNote').textContent = counted ? `${kept}일 지킴` : '기록 없음';

      <div class="msg">${dateLabel(date)} · ${L.msg}${p.total ? ` (${p.done + p.tdone}/${p.target}${p.rest ? ` · 쉼 ${p.rest}` : ''}${p.doing ? ` · 진행 중 ${p.doing}` : ''})` : ''}</div>

  html += `<div class="section" style="margin-top:${p.total ? 14 : 0}px">
      <button class="addtodo" data-addtodo>
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>${isToday ? '오늘' : dateShort(date)} 할 일 더하기</button>
    </div>
    <div class="section" style="margin-top:22px;display:flex;flex-direction:column;gap:9px">
      <button class="btn btn-o" data-manage style="width:100%">루틴 관리</button>
      <button class="btn btn-g" data-preset2 style="width:100%">보기에서 더 담기</button>
    </div>`;

  host.innerHTML = html;
  bindWeekBar(host);
  $$('[data-fold]', host).forEach(b => b.onclick = () => toggleGroupFold(b.dataset.fold));
  $$('.ritem', host).forEach(row => {
    const rid = row.dataset.r, tid = row.dataset.t;
    if (rid) {
      $$('[data-ck]', row).forEach(b => b.onclick = () => toggleCheck(rid, date));
      row.querySelector('[data-opt]').onclick = () => openRoutineOptions(rid, date);
    } else {
      $$('[data-ck]', row).forEach(b => b.onclick = () => toggleTodo(tid, date));
      row.querySelector('[data-opt]').onclick = () => openTodoOptions(tid, date);
    }
  });
  host.querySelector('[data-addtodo]').onclick = () => openTodoAdder(date);
  host.querySelector('[data-manage]').onclick = openRoutineManage;
  host.querySelector('[data-preset2]').onclick = openPresetPicker;
  const sb = host.querySelector('[data-sort]');
  if (sb) sb.onclick = openSortPicker;
  renderRoutineRibbon(); updateTabBadge();
}

/* ---------- 주간 날짜 바 — 다른 날을 열어 할 일을 미리 담을 수 있다 ---------- */
function weekBarHTML(date, today) {
  const d0 = new Date(date + 'T00:00:00');
  d0.setDate(d0.getDate() - d0.getDay());        /* 그 주 일요일로 */
  let cells = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(d0); d.setDate(d.getDate() + i);
    const key = ymd(d);
    const q = dayProgress(key);
    const later = key > today;
    let pip = 'background:var(--line)';
    if (!later && q.rate >= 0) pip = `background:${lightOf(q.rate).color}`;
    else if (q.todos.length) pip = `background:${famColor('power')}`;
    const cls = ['wkday', key === date ? 'sel' : '', key === today ? 'today' : '', later ? 'later' : ''].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-wd="${key}">
      ${DOW[i]}<b>${d.getDate()}</b><i class="pip" style="${pip}"></i></button>`;
  }
  const note = date === today ? '' :
    `<button class="daynote" data-wtoday><b>${dateLabel(date)}</b> 보는 중 · 오늘로 돌아가기</button>`;
  return `<div class="wkbar">
      <button class="nav" data-wprev aria-label="지난 주"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="wkdays">${cells}</div>
      <button class="nav" data-wnext aria-label="다음 주"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>${note ? `<div class="section">${note}</div>` : ''}`;
}

function bindWeekBar(host) {
  const go = key => { S.rday = key; renderRoutine(); window.scrollTo({ top: 0 }); };
  const shift = n => {
    const d = new Date((S.rday || ymd(new Date())) + 'T00:00:00');
    d.setDate(d.getDate() + n); go(ymd(d));
  };
  $$('[data-wd]', host).forEach(b => b.onclick = () => go(b.dataset.wd));
  host.querySelector('[data-wprev]').onclick = () => shift(-7);
  host.querySelector('[data-wnext]').onclick = () => shift(7);
  const back = host.querySelector('[data-wtoday]');
  if (back) back.onclick = () => go(ymd(new Date()));
}

/* ---------- 할 일 다루기 ---------- */
async function setTodo(date, tid, patch) {
  const list = dayTodos(date).map(t => t.id === tid ? Object.assign({}, t, patch) : t);
  await saveTodos(date, list);
}

/* 할 일은 체크해도 창을 띄우지 않는다 — 빠르게 지워 나가는 자리라서 */
async function toggleTodo(tid, date) {
  const t = dayTodos(date).find(x => x.id === tid); if (!t) return;
  await setTodo(date, tid, { s: t.s === 'done' ? '' : 'done', at: Date.now() });
  renderRoutine();
}

    <div class="field" style="margin-top:0">
      <div class="label">할 일 내용</div>
      <div class="box"><textarea id="tdName" class="oneline" rows="1" maxlength="40" placeholder="무엇을 할까요?" autocomplete="off">${esc(t0.name)}</textarea></div>

      <button class="btn btn-g" data-s="done" style="flex:1">완료</button>

      $$('[data-s]', root).forEach(b => b.onclick = async () => {

/* 목록을 늘어놓는 차례.
   시간대가 지워졌거나 알 수 없는 루틴은 맨 뒤로 보내되 목록에서 빠지지는 않는다. */
function sortRoutines(list) {
  const mode = S.settings.rsort || 'slot';
  const ids = allSlots().map(s => s.id);
  const slotIdx = r => { const i = ids.indexOf(r.slot || 'any'); return i < 0 ? ids.length : i; };
  const ord = r => (r.order || 0);
  const born = r => String(r.createdAt || r.startDate || '');
  const arr = [...list];
  switch (mode) {
    case 'manual': arr.sort((a, b) => ord(a) - ord(b)); break;
    case 'old': arr.sort((a, b) => born(a).localeCompare(born(b)) || ord(a) - ord(b)); break;
    /* 한꺼번에 담은 루틴은 만든 시각이 모두 같다. 그때는 담은 차례를 뒤집어야 '나중' 답다 */
    case 'new': arr.sort((a, b) => born(b).localeCompare(born(a)) || ord(b) - ord(a)); break;
    case 'name': arr.sort((a, b) => a.name.localeCompare(b.name, 'ko')); break;
    default: arr.sort((a, b) => slotIdx(a) - slotIdx(b) || ord(a) - ord(b));
  }
  return arr;
}

function openSortPicker() {
  const cur = S.settings.rsort || 'slot';
  sheet('루틴 늘어놓는 차례', SORTS.map(s => `
    <div class="rowitem"><div class="rl"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></div>
      <button class="btn ${s.id === cur ? 'btn-p' : 'btn-g'}" data-so="${s.id}">${s.id === cur ? '보는 중' : '이걸로'}</button></div>`).join(''),
    (root, close) => {
      $$('[data-so]', root).forEach(b => b.onclick = async () => {
        S.settings.rsort = b.dataset.so;
        await saveSettings();
        close(); renderRoutine();
        toast(`${SORTS.find(s => s.id === b.dataset.so).name} 로 늘어놓을게요`);
      });
    });
}

/* 이 루틴을 체크했을 때 메모 창을 띄울지 — 루틴 설정이 전체 설정보다 앞선다 */
function wantsMemo(r) {
  const mode = (r && r.memoMode) || 'auto';
  if (mode === 'on') return true;
  if (mode === 'off') return false;
  return S.settings.memoOnCheck !== false;
}

async function toggleCheck(rid, date) {
  date = date || ymd(new Date());
  const cur = dayChecks(date)[rid] || {};
  const turningOn = cur.s !== 'done';
  const next = cur.s === 'done'
    ? (cur.memo ? { s: '', memo: cur.memo } : null)
    : Object.assign({}, cur, { s: 'done', at: Date.now() });
  await setCheck(date, rid, next && (next.s || next.memo) ? next : null);
  renderRoutine();
  /* 방금 완료로 표시했으면 메모 창을 바로 띄운다.
     루틴마다 따로 정해 둔 값이 있으면 그것이 전체 설정보다 앞선다. */
  if (turningOn && wantsMemo(S.routines.find(x => x.id === rid))) openRoutineOptions(rid, date, { focusMemo: true });
}

function openRoutineOptions(rid, date, opts = {}) {
  const r = S.routines.find(x => x.id === rid); if (!r) return;
  const c = dayChecks(date)[rid] || {};
  sheet(`${r.emoji || '✅'} ${r.name}`, `
    <div style="display:flex;gap:8px">
      <button class="btn ${c.s === 'done' ? 'btn-p' : 'btn-g'}" data-s="done" style="flex:1">완료</button>
      <button class="btn ${c.s === 'rest' ? 'btn-p' : 'btn-g'}" data-s="rest" style="flex:1">오늘은 쉼</button>
      <button class="btn btn-o" data-s="" style="flex:1">지우기</button>
    </div>
    <div class="field">
      <div class="label">한 줄 메모</div>
      <div class="box"><textarea id="rMemo" class="oneline" rows="1" maxlength="60" placeholder="오늘 이 루틴은 어땠나요?" autocomplete="off">${esc(c.memo || '')}</textarea></div>
    </div>
    <button class="btn btn-p" id="rMemoSave" style="width:100%;margin-top:14px">메모 저장</button>
    <button class="btn btn-o" id="rGoEdit" style="width:100%;margin-top:8px">루틴 고치기</button>`,
    (root, close) => {
      /* 상태를 골라도 창은 닫지 않는다. 메모를 마저 적을 수 있게.
         창은 '메모 저장'·X·뒤로 가기로만 닫힌다. */
      const cur = { s: c.s || '', memo: c.memo || '' };
      const paintState = () => $$('[data-s]', root).forEach(b => {
        const on = b.dataset.s && b.dataset.s === cur.s;
        b.className = 'btn ' + (on ? 'btn-p' : (b.dataset.s ? 'btn-g' : 'btn-o'));
      });

      $$('[data-s]', root).forEach(b => b.onclick = async () => {
        cur.s = b.dataset.s;
        cur.memo = $('#rMemo', root).value.trim();
        await setCheck(date, rid, (cur.s || cur.memo) ? { s: cur.s, memo: cur.memo, at: Date.now() } : null);
        paintState();
        renderRoutine(); opts.after && opts.after();   /* 뒤에 깔린 목록은 바로 따라 바뀐다 */
      });
      $('#rMemoSave', root).onclick = async () => {
        const memo = $('#rMemo', root).value.trim();
        cur.memo = memo;
        await setCheck(date, rid, (cur.s || memo) ? { s: cur.s, memo, at: Date.now() } : null);
        close(); renderRoutine(); opts.after && opts.after();
        toast(memo ? '메모를 저장했어요' : '메모를 지웠어요');
      };
      $('#rGoEdit', root).onclick = () => { close(); openRoutineEdit(rid); };
      /* 여러 줄 칸이지만 한 줄로 쓰는 자리다. 줄바꿈 대신 저장으로 넘긴다 */
      $('#rMemo', root).onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); $('#rMemoSave', root).click(); }
      };
      /* 체크하자마자 뜬 창이면 바로 적을 수 있게 커서를 놓아준다 */
      if (opts.focusMemo) { const i = $('#rMemo', root); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    });
}
