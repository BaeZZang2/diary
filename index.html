      const on = r.days.includes(+b.dataset.d);
      b.classList.toggle('on', on);
      b.style.cssText = on ? 'background:var(--ivory);border-color:var(--ivory)' : '';
    });
    $$('[data-mm]', scr).forEach(b => {
      const on = b.dataset.mm === r.memoMode;
      b.classList.toggle('on', on);
      b.style.cssText = on ? 'background:var(--ivory);border-color:var(--ivory)' : '';
    });
  };

  /* 시간대는 도중에 늘거나 줄 수 있어 목록째 다시 그린다 */
  function paintSlots() {
    if (!findSlot(r.slot)) r.slot = 'any';        /* 쓰던 시간대가 지워졌으면 되돌린다 */
    const host = $('#rSlot', scr);
    host.innerHTML = allSlots().map(s =>
      `<button class="word" data-sl="${s.id}">${s.icon} ${esc(s.name)}</button>`).join('')
      + `<button class="word" data-sl-new style="border-style:dashed">＋ 직접 입력</button>`;
    $$('[data-sl]', host).forEach(b => {
      const on = b.dataset.sl === r.slot;
      b.classList.toggle('on', on);
      b.style.cssText = on ? 'background:var(--ivory);border-color:var(--ivory)' : '';
      b.onclick = () => { r.slot = b.dataset.sl; paintSlots(); };
    });
    host.querySelector('[data-sl-new]').onclick = () =>
      openSlotMaker(newId => { if (newId) r.slot = newId; paintSlots(); });
  }

  /* 묶음이 없는 루틴은 '묶지 않음' 이 골라진 채로 보인다. gid 가 비어 있거나
     이미 지워진 묶음을 가리켜도 이 버튼이 자동으로 선택돼서 안전하다 */
  function paintGid() {
    const host = $('#rGid', scr);
    const groups = sortedGroups();
    host.innerHTML = `<button class="word" data-gid="">묶지 않음</button>` +
      groups.map(g => `<button class="word" data-gid="${g.id}">${esc(g.name)}</button>`).join('')
      + (groups.length ? '' : `<div style="font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.7;width:100%">
          아직 만든 묶음이 없어요. ‘루틴 관리’ 화면에서 먼저 만들 수 있어요.</div>`);
    $$('[data-gid]', host).forEach(b => {
      const on = (r.gid || '') === b.dataset.gid;
      b.classList.toggle('on', on);
      b.style.cssText = on ? 'background:var(--ivory);border-color:var(--ivory)' : '';
      b.onclick = () => { r.gid = b.dataset.gid; paintGid(); };
    });
  }

  paint();
  paintSlots();
  paintGid();
  /* 이름도 한 줄로 쓰는 자리다 */
  $('#rName', scr).onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };

  $$('[data-e]', scr).forEach(b => b.onclick = () => { r.emoji = b.dataset.e; paint(); });
  $$('[data-mm]', scr).forEach(b => b.onclick = () => { r.memoMode = b.dataset.mm; paint(); });
  $$('[data-d]', scr).forEach(b => b.onclick = () => {
    const d = +b.dataset.d;
    r.days = r.days.includes(d) ? r.days.filter(x => x !== d) : [...r.days, d].sort();
    paint();
  });
  $$('[data-preset-days]', scr).forEach(b => b.onclick = () => {
    r.days = { all: [0, 1, 2, 3, 4, 5, 6], week: [1, 2, 3, 4, 5], end: [0, 6] }[b.dataset.presetDays];
    paint();
  });

  scr.querySelector('[data-save]').onclick = async () => {
    const name = $('#rName', scr).value.trim();
    if (!name) { toast('이름을 적어주세요'); return; }
    if (!r.days.length) { toast('반복할 요일을 하나 이상 골라주세요'); return; }
    r.name = name;
    if (src) Object.assign(src, r);
    else {
      r.startDate = ymd(new Date());
      r.createdAt = new Date().toISOString();
      r.order = S.routines.length ? Math.max(...S.routines.map(x => x.order || 0)) + 1 : 0;
      S.routines.push(r);
    }
    await saveRoutines();
    close(); renderRoutine(); toast(id ? '루틴을 고쳤어요' : '루틴을 담았어요');
  };

  if (id) {
    scr.querySelector('[data-arch]').onclick = async () => {
      if (src.active === false) { src.active = true; src.archivedDate = ''; }
      else { src.active = false; src.archivedDate = ymd(new Date()); }
      await saveRoutines();
      close(); renderRoutine();
      toast(src.active === false ? '보관했어요' : '다시 사용해요');
    };
    scr.querySelector('[data-del]').onclick = async () => {
      if (!confirm('이 루틴과 지금까지의 체크 기록을 함께 지울까요?')) return;
      S.routines = S.routines.filter(x => x.id !== id);
      await saveRoutines();
      for (const [ym, bucket] of Object.entries(S.checks)) {
        let hit = false;
        for (const date of Object.keys(bucket)) {
          if (bucket[date][id]) { delete bucket[date][id]; hit = true; }
          if (!Object.keys(bucket[date]).length) delete bucket[date];
        }
        if (hit) await KV.set(K.check(ym), bucket);
      }
      close(); renderRoutine(); toast('루틴을 지웠어요');
    };
  }
}

/* ---------- 시간대 직접 만들기 ---------- */
function openSlotMaker(cb) {
  sheet('시간대 직접 만들기', `
    <div class="label">새 시간대 이름</div>
    <div class="box"><textarea id="slName" class="oneline" rows="1" maxlength="12" placeholder="예: 새벽 · 출근길 · 자기 전" autocomplete="off"></textarea></div>
    <button class="btn btn-p" id="slAdd" style="width:100%;margin-top:11px">만들기</button>
    <div style="font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.7">
      직접 만든 시간대는 저녁 다음, ‘아무 때나’ 앞에 만든 순서대로 놓여요.</div>
    <div id="slList" style="margin-top:20px"></div>`,
    (root, close) => {
      const paint = () => {
        const host = $('#slList', root);
        if (!S.slots.length) { host.innerHTML = ''; return; }
        host.innerHTML = `<div class="label">직접 만든 시간대</div>` + S.slots.map(s => {
          const used = S.routines.filter(r => r.slot === s.id).length;
          return `<div class="rowitem"><div class="rl"><b>${esc(s.icon)} ${esc(s.name)}</b>
            <span>${used ? `루틴 ${used}개가 쓰고 있어요` : '쓰는 루틴이 없어요'}</span></div>
            <button class="btn btn-o" data-del="${s.id}" style="color:var(--mad);border-color:#DB4F6544">지우기</button></div>`;
        }).join('');
        $$('[data-del]', host).forEach(b => b.onclick = async () => {
          const s = S.slots.find(x => x.id === b.dataset.del); if (!s) return;
          const used = S.routines.filter(r => r.slot === s.id);
          const ok = confirm(used.length
            ? `‘${s.name}’ 을 지우면 이 시간대의 루틴 ${used.length}개는 ‘아무 때나’ 로 옮겨져요. 계속할까요?`
            : `‘${s.name}’ 을 지울까요?`);
          if (!ok) return;
          used.forEach(r => r.slot = 'any');
          S.slots = S.slots.filter(x => x.id !== s.id);
          await saveSlots();
          if (used.length) await saveRoutines();
          paint(); cb('');
          if (S.tab === 'routine') renderRoutine();   /* 뒤에 깔린 목록의 묶음도 다시 짠다 */
          toast('시간대를 지웠어요');
        });
      };
      paint();

      const add = async () => {
        const name = $('#slName', root).value.trim();
        if (!name) { toast('이름을 적어주세요'); return; }
        if (allSlots().some(s => s.name === name)) { toast('이미 있는 시간대예요'); return; }
        const s = { id: 'sl' + uid(), name, icon: '🕘' };
        S.slots.push(s); await saveSlots();
        close(); cb(s.id); toast(`‘${name}’ 시간대를 만들었어요`);
      };
      $('#slAdd', root).onclick = add;
      $('#slName', root).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
    });
}

/* ---------- 루틴 관리 ---------- */
function openRoutineManage() {
  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<div class="inner">
    <div class="screenbar">
      <button class="iconbtn" data-x><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl">루틴 관리</div>
      <button class="btn btn-p" data-new>추가</button>
    </div>
    <div style="font-size:11.5px;color:var(--faint);margin:16px 0 2px;line-height:1.7">
      여기서 옮긴 차례는 목록을 <b style="color:var(--dim)">‘내가 정한 순서’</b> 로 볼 때 그대로 보여요.</div>
    <div id="rmList"></div>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:22px">
      <button class="btn btn-o" data-preset style="width:100%">보기에서 골라 담기</button>
      <button class="btn btn-o" data-groups style="width:100%">루틴 묶음</button>
    </div>
  </div>`;
  $('#layers').appendChild(scr);
  scr.querySelector('[data-x]').onclick = () => { scr.remove(); renderRoutine(); };
  scr.querySelector('[data-new]').onclick = () => openRoutineEdit(null);
  scr.querySelector('[data-preset]').onclick = openPresetPicker;
  /* 묶음 화면으로 넘어갈 땐 이 화면은 접어 둔다 — 뒤로 가면 목록이 최신으로 다시 그려진다 */
  scr.querySelector('[data-groups]').onclick = () => { scr.remove(); openGroupManage(); };

  const paint = () => {
    const list = [...S.routines].sort((a, b) => (a.order || 0) - (b.order || 0));
    const host = $('#rmList', scr);
    if (!list.length) {
      host.innerHTML = `<div class="empty"><b>아직 루틴이 없어요</b>위 추가 버튼으로 만들어 보세요.</div>`;
      return;
    }
    host.innerHTML = list.map((r, i) => {
      const days = r.days.length === 7 ? '매일'
        : r.days.length === 5 && !r.days.includes(0) && !r.days.includes(6) ? '평일'
          : r.days.length === 2 && r.days.includes(0) && r.days.includes(6) ? '주말'
            : r.days.map(d => DOW[d]).join('·');
      return `<div class="rmg ${r.active === false ? 'off' : ''}">
        <span class="em">${esc(r.emoji || '✅')}</span>
        <button class="bd" style="text-align:left" data-edit="${r.id}">
          <b>${esc(r.name)}</b>
          <span>${slotName(r.slot)} · ${esc(days)}${r.active === false ? ' · 보관됨' : ''}</span>
        </button>
        <button class="mv" data-up="${r.id}" ${i === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button class="mv" data-down="${r.id}" ${i === list.length - 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>`;
    }).join('');

    $$('[data-edit]', host).forEach(b => b.onclick = () => { scr.remove(); openRoutineEdit(b.dataset.edit); });
    const move = async (id, dir) => {
      const arr = [...S.routines].sort((a, b) => (a.order || 0) - (b.order || 0));
      const i = arr.findIndex(x => x.id === id), j = i + dir;
      if (i < 0 || j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      arr.forEach((x, n) => x.order = n);
      S.routines = arr;
      await saveRoutines(); paint();
    };
    $$('[data-up]', host).forEach(b => b.onclick = () => move(b.dataset.up, -1));
    $$('[data-down]', host).forEach(b => b.onclick = () => move(b.dataset.down, 1));
  };
  paint();
}

/* ---------- 보기에서 골라 담기 ---------- */
function openPresetPicker() {
  const picked = new Set();
  /* 담자마자 어느 묶음에 넣을지 여기서 고른다. 담고 나서 관리 화면을 다시
     찾아 들어가지 않게 하려는 것. 묶음이 없으면 이 줄은 아예 안 보인다. */
  let gid = '';
  const groupRow = S.groups.length ? `<div style="margin-bottom:16px">
    <div class="label">담을 묶음</div>
    <div class="words" id="pkGid"><button class="word" data-g="">묶지 않음</button>` +
    sortedGroups().map(g => `<button class="word" data-g="${g.id}">${esc(g.name)}</button>`).join('') +
    `</div></div>` : '';
  const body = groupRow + SLOTS.map(s => {
    const items = ROUTINE_PRESETS.filter(p => p.slot === s.id);
    if (!items.length) return '';
    return `<div style="margin-bottom:16px"><div class="label">${s.icon} ${s.name}</div>
      <div class="words">${items.map(p =>
        `<button class="word" data-p="${esc(p.name)}">${p.emoji} ${esc(p.name)}</button>`).join('')}</div></div>`;
  }).join('') + `<button class="btn btn-p" id="pkAdd" style="width:100%;margin-top:6px">고른 것 담기</button>`;

  sheet('루틴 보기', body, (root, close) => {
    const paintGid = () => $$('[data-g]', root).forEach(b => {
      const on = b.dataset.g === gid;
      b.style.cssText = on ? 'background:var(--ivory);border-color:var(--ivory)' : '';
      b.onclick = () => { gid = b.dataset.g; paintGid(); };
    });
    paintGid();
    $$('[data-p]', root).forEach(b => b.onclick = () => {
      const n = b.dataset.p;
      if (picked.has(n)) picked.delete(n); else picked.add(n);
      b.classList.toggle('on', picked.has(n));
      b.style.cssText = picked.has(n) ? 'background:var(--ivory);border-color:var(--ivory)' : '';
      $('#pkAdd', root).textContent = picked.size ? `${picked.size}개 담기` : '고른 것 담기';
    });
    $('#pkAdd', root).onclick = async () => {
      if (!picked.size) { toast('담을 루틴을 골라주세요'); return; }
      const today = ymd(new Date());
      let order = S.routines.length ? Math.max(...S.routines.map(x => x.order || 0)) + 1 : 0;
      let n = 0;
      for (const p of ROUTINE_PRESETS) {
        if (!picked.has(p.name)) continue;
        if (S.routines.some(r => r.name === p.name && r.active !== false)) continue;
        S.routines.push({
          id: uid(), name: p.name, emoji: p.emoji, slot: p.slot, gid,
          days: [0, 1, 2, 3, 4, 5, 6], active: true,
          startDate: today, createdAt: new Date().toISOString(), order: order++
        });
        n++;
      }
      await saveRoutines();
      close();
      /* 관리 화면이 열려 있으면 그것도 닫아 새 목록으로 다시 그린다 */
      const mg = $$('.screen').find(s => s.querySelector('#rmList'));
      if (mg) mg.remove();
      renderRoutine();
      const g = gid ? groupById(gid) : null;
      toast(n ? (g ? `‘${g.name}’ 묶음에 ${n}개를 담았어요` : `${n}개를 담았어요`)
        : '이미 담겨 있는 루틴이에요');
    };
  });
}

/* ---------- 루틴 묶음 관리 ---------- */
function openGroupManage() {
  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<div class="inner">
    <div class="screenbar">
      <button class="iconbtn" data-x><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>

      return;
    }

          <span>루틴 ${n}개</span>

        <button class="mv" data-up="${g.id}" ${i === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>

    const move = async (id, dir) => {

      [arr[i], arr[j]] = [arr[j], arr[i]];
      arr.forEach((x, n) => x.order = n);
      S.groups = arr;

    $$('[data-up]', host).forEach(b => b.onclick = () => move(b.dataset.up, -1));

  paint();

  scr.querySelector('[data-new]').onclick = () => openGroupAdd(paint);

/* 묶음에 담을 루틴 줄 — 새로 만들 때와 고칠 때 같은 모양을 쓴다.
   만들 때는 아직 묶음이 없어 고른 것을 잠시 들고 있고, 고칠 때는 바로 저장한다.
   그 차이만 isOn 으로 물어본다. */
function groupRoutineListHTML(isOn, curGid) {
  const list = [...S.routines].sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!list.length) return `<div class="empty" style="padding:30px 10px"><b>아직 루틴이 없어요</b>먼저 루틴을 만들면 여기서 담을 수 있어요.</div>`;
  return list.map(r => {
    const on = isOn(r);
    /* 루틴은 한 묶음에만 들 수 있다. 이미 다른 묶음에 있는 것을 담으면 그쪽에서
       빠지는데, 모르고 누르면 남의 묶음이 조용히 헐린다. 그래서 미리 알려준다. */
    const other = r.gid && r.gid !== curGid ? groupById(r.gid) : null;
    const note = [
      r.active === false ? '보관됨' : '',

/* ---------- 루틴 통계 ---------- */
function routineRangeStats(days) {
  const today = new Date(), per = {};
  let plan = 0, done = 0;
  for (let i = 0; i < days; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = ymd(d), ck = dayChecks(key);
    for (const r of routinesOn(key)) {
      const s = (ck[r.id] || {}).s;
      const box = per[r.id] || (per[r.id] = { r, plan: 0, done: 0 });
      box.plan++; plan++;
      /* 완료는 1, 쉼은 그 절반으로 센다 */
      const w = s === 'done' ? 1 : s === 'rest' ? REST_WEIGHT : 0;
      if (w) { box.done += w; done += w; }
    }
  }
  return { per, plan, done, rate: plan ? done / plan : -1 };
}

/* 예정된 루틴을 모두 지킨 날의 연속. 예정이 없는 날은 끊지 않고 건너뛴다.
   오늘이 아직 안 끝났으면 오늘은 끊지 않고 어제부터 센다. */
function routineStreak() {
  let streak = 0, first = true;
  const cur = new Date();
  for (let i = 0; i < 400; i++) {
    const p = dayProgress(ymd(cur));
    if (p.total > 0) {
      const ok = p.left === 0;                    /* 완료·쉼으로 다 정리한 날 */
      if (ok) streak++;
      else if (!first) break;
    }
    cur.setDate(cur.getDate() - 1); first = false;
  }
  return streak;
}

/* 루틴을 지킨 날과 못 지킨 날의 감정을 견줘 본다.
   기쁨·평온·힘 계열을 '올라간 감정'으로 묶고, 그 비율 차이를 본다. */
function routineEmotionInsights(days = 180) {
  const POS = new Set(['joy', 'calm', 'power']);
  const byDate = {};
  for (const m of S.index) (byDate[m.date] = byDate[m.date] || []).push(m);
  const today = new Date(), out = [];
  for (const r of S.routines) {
    if (r.active === false) continue;
    const g = { done: { pos: 0, all: 0, days: 0 }, miss: { pos: 0, all: 0, days: 0 } };
    for (let i = 0; i < days; i++) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const key = ymd(d);
      const metas = byDate[key];
      if (!metas || !routinesOn(key).some(x => x.id === r.id)) continue;
      const s = (dayChecks(key)[r.id] || {}).s;
      if (s === 'rest') continue;
      const box = s === 'done' ? g.done : g.miss;
      box.days++;
      for (const m of metas) for (const w of m.emos || []) { box.all++; if (POS.has(famOf(w))) box.pos++; }
    }
    if (g.done.days < 3 || g.miss.days < 3 || !g.done.all || !g.miss.all) continue;
    const a = g.done.pos / g.done.all, b = g.miss.pos / g.miss.all;
    if (Math.abs(a - b) < .1) continue;
    out.push({ r, a, b, dd: g.done.days, md: g.miss.days });
  }
  return out.sort((x, y) => Math.abs(y.a - y.b) - Math.abs(x.a - x.b)).slice(0, 5);
}

function maybeRemind() {
  if (S.settings.remind === false) return;
  const today = ymd(new Date());
  if (S.settings.remindLog === today) return;
  const p = dayProgress(today);
  const left = p.left;
  if (left <= 0) return;
  S.settings.remindLog = today; saveSettings();
  setTimeout(() => toast(`오늘 남은 루틴이 ${left}개 있어요`), 1000);
}

  let sel = [...selected], famId = 'all', kw = '';

          `<span class="etag" style="background:${colorOf(w)}22;color:${colorOf(w)};border:1px solid ${colorOf(w)}55">${esc(w)} ✕</span>`).join('')

        const words = (famId === 'all' ? FAMILIES.flatMap(f => EMOTIONS[f.id]) : EMOTIONS[famId])

        }).join('') || `<div style="color:var(--faint);font-size:13px">해당하는 단어가 없어요. 직접 적어도 좋아요.</div>`;
        $$('.word', ws).forEach(b => b.onclick = () => {

        <img src="${p.thumb || p.data}" alt="">
        <button class="star" data-star><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg></button>
        <button class="del" data-del2><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>`).join('') +
      `<button class="padd" id="fPick"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-6 6"/></svg>사진 추가</button>`;
    $('#fPick', fp).onclick = () => $('#fFile', scr).click();
    $$('[data-star]', fp).forEach(b => b.onclick = e => {
      e.stopPropagation(); entry.cover = b.closest('.pthumb').dataset.p; paintPhotos();
    });
    $$('[data-del2]', fp).forEach(b => b.onclick = e => {
      e.stopPropagation();
      const pid = b.closest('.pthumb').dataset.p;
      entry.photos = entry.photos.filter(x => x.id !== pid);
      if (entry.cover === pid) entry.cover = entry.photos[0] ? entry.photos[0].id : '';
      paintPhotos();
    });
  }
  $('#fFile', scr).onchange = async e => {
    const files = [...e.target.files].slice(0, 10); e.target.value = '';
    if (!files.length) return;
    toast('사진을 정리하는 중…');
    for (const f of files) {
      try {
        const data = await shrink(f, 1440, .72);
        const thumb = await shrink(f, 360, .6);
        const p = { id: uid(), data, thumb };
        entry.photos.push(p);
        if (!entry.cover) entry.cover = p.id;
      } catch (err) { toast('불러오지 못한 사진이 있어요'); }
    }
    paintPhotos();
  };
  paintPhotos();

  /* 오늘의 질문 — 항상 보이고, 다른 질문으로 바꿀 수 있다 */
  function paintPrompt() {
    $('#fPromptField', scr).innerHTML = `
      <div class="label" style="display:flex;align-items:center;gap:8px">
        오늘의 질문 · ${esc(entry.prompt.cat)}
        <button id="fPShuf" style="margin-left:auto;text-transform:none;letter-spacing:.02em;
          font-size:11px;color:var(--dim);border-bottom:1px solid var(--line)">다른 질문</button></div>
      <div class="box">
        <q style="font-family:var(--se);font-size:16px;font-weight:600;line-height:1.45;display:block;margin-bottom:9px;color:var(--dim);quotes:none">${esc(entry.prompt.q)}</q>
        <textarea id="fPromptA" rows="3" placeholder="떠오르는 대로 적어보세요 (비워두면 저장되지 않아요)">${esc(entry.prompt.a || '')}</textarea>
      </div>`;
    $('#fPromptA', scr).oninput = e => entry.prompt.a = e.target.value;
    $('#fPShuf', scr).onclick = () => {
      pOff++;
      const [c1, q1] = todaysPrompt(entry.date, pOff);
      entry.prompt = { cat: c1, q: q1, a: entry.prompt.a };
      paintPrompt();
    };
  }
  paintPrompt();

  /* 감사일기 */
  function paintGrat() {
    const g = $('#fGrat', scr);
    g.innerHTML = entry.gratitude.map((v, i) => `
      <div class="gline" data-g="${i}">
        <span class="gn">${i + 1}</span>
        <textarea class="oneline" rows="1" placeholder="${i === 0 ? '예: 따뜻한 커피 한 잔' : '오늘 고마웠던 것'}" autocomplete="off">${esc(v)}</textarea>
        ${entry.gratitude.length > 1 ? `<button class="gx" data-gx aria-label="줄 지우기">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>` : ''}
      </div>`).join('');
    $$('.gline', g).forEach(row => {
      const i = +row.dataset.g;
      const box = row.querySelector('textarea');
      box.oninput = e => entry.gratitude[i] = e.target.value;
      /* 한 줄씩 쓰는 자리라 줄바꿈 대신 다음 줄로 넘어간다 */
      box.onkeydown = e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const next = $$('.gline textarea', g)[i + 1];
        if (next) next.focus(); else $('#fGratAdd', scr).click();
      };
      const x = row.querySelector('[data-gx]');
      if (x) x.onclick = () => { entry.gratitude.splice(i, 1); paintGrat(); };
    });
  }
  $('#fGratAdd', scr).onclick = () => {
    if (entry.gratitude.length >= 10) { toast('감사일기는 10줄까지 쓸 수 있어요'); return; }
    entry.gratitude.push(''); paintGrat();
    const rows = $$('.gline textarea', scr); rows[rows.length - 1].focus();
  };
  paintGrat();

  /* 감정 카드 */
  const fc = $('#fCards', scr);
  function paintCards() {
    fc.innerHTML = entry.cards.map((c, i) => {
      const fams = c.emotions.map(famOf);
      const line = fams.length ? famColor(fams[0]) : 'var(--faint)';
      return `<div class="ecard" data-c="${c.id}" style="border-left-color:${line}">
        <div class="eh"><span class="n">CARD ${pad(i + 1)}</span>
          <button class="iconbtn" style="width:26px;height:26px;margin-left:auto" data-rm>
            <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>

        <div class="subfield"><div class="sl">① 상황 <em>무슨 일이 있었나 (사실만)</em></div>
          <textarea class="mini" rows="2" data-ev placeholder="예: 회의에서 내 의견이 그냥 넘어갔다">${esc(c.event)}</textarea></div>

        <div class="subfield"><div class="sl">② 감정 <em>그때 마음에 가까운 단어</em></div>
          <button class="selectbtn" data-emo>
            ${c.emotions.length ? c.emotions.map(w =>
              `<span class="etag" style="background:${colorOf(w)}22;color:${colorOf(w)};border:1px solid ${colorOf(w)}55">${esc(w)}</span>`).join('')
              : '<span class="ph2">감정 단어 고르기</span>'}
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>

        <div class="subfield"><div class="sl">③ 바람 <em>내게 필요했던 것</em></div>
          <textarea class="mini" rows="2" data-nd placeholder="예: 내 말이 존중받는 느낌">${esc(c.need)}</textarea>
          <button class="btn btn-g" data-needpick style="margin-top:6px;font-size:12px;padding:6px 11px">욕구 단어에서 찾기</button></div>
      </div>`;
    }).join('');

    $$('.ecard', fc).forEach(box => {
      const c = entry.cards.find(x => x.id === box.dataset.c);
      box.querySelector('[data-rm]').onclick = () => {
        if (entry.cards.length === 1) { entry.cards = [newCard()]; }
        else entry.cards = entry.cards.filter(x => x.id !== c.id);
        paintCards();
      };
      box.querySelector('[data-emo]').onclick = () => pickEmotions(c.emotions, sel => { c.emotions = sel; paintCards(); });
      box.querySelector('[data-ev]').oninput = e => c.event = e.target.value;
      box.querySelector('[data-nd]').oninput = e => c.need = e.target.value;
      box.querySelector('[data-needpick]').onclick = () => pickNeed(n => {
        c.need = (c.need ? c.need.replace(/\s*$/, ' ') : '') + n; paintCards();
      });
    });
  }
  $('#fAdd', scr).onclick = () => { entry.cards.push(newCard()); paintCards(); scr.scrollTop = scr.scrollHeight; };
  paintCards();

  /* 태그 */
  function paintTags() {
    $('#fTags', scr).innerHTML = entry.tags.map(t =>
      `<span class="dtag" data-t="${esc(t)}">${esc(t)} ✕</span>`).join('') ||
      `<span style="font-size:12px;color:var(--faint)">태그가 없어요</span>`;
    $$('#fTags [data-t]', scr).forEach(s => s.onclick = () => {
      entry.tags = entry.tags.filter(x => x !== s.dataset.t); paintTags();
    });
  }
  $('#fTagIn', scr).onkeydown = e => {
    if (e.key !== 'Enter' && e.key !== ',') return;
    e.preventDefault();
    let v = e.target.value.trim().replace(/^#*/, '');
    if (!v) return;
    v = '#' + v;
    if (!entry.tags.includes(v)) entry.tags.push(v);
    e.target.value = ''; paintTags();
  };
  paintTags();

  /* 저장 */
  scr.querySelector('[data-save]').onclick = async () => {
    entry.date = $('#fDate', scr).value || entry.date;
    entry.text = $('#fText', scr).value;
    const pa = $('#fPromptA', scr);
    if (entry.prompt && pa) entry.prompt.a = pa.value;
    entry.gratitude = $$('.gline textarea', scr).map(i => i.value.trim()).filter(Boolean);
    entry.cards = entry.cards.filter(c => c.emotions.length || c.event.trim() || c.need.trim());
    entry.tags = [...new Set([...entry.tags, ...extractTags(entry.text)])];
    const answered = !!(entry.prompt && entry.prompt.a && entry.prompt.a.trim());
    if (!answered && entry.prompt) entry.prompt = null;  /* 답이 없으면 질문은 남기지 않는다 */
    const hasContent = entry.text.trim() || entry.photos.length || entry.cards.length
      || entry.gratitude.length || answered;
    if (!hasContent) { toast('아직 아무것도 적히지 않았어요'); return; }
    const cover = entry.photos.find(p => p.id === entry.cover) || entry.photos[0];
    try {
      await saveEntry(entry, cover ? cover.thumb : '');
      if (answered) { S.settings.promptLog[entry.date] = true; await saveSettings(); }
      close(); renderHome(); toast('저장했어요');
    } catch (err) { toast('저장에 실패했어요. 사진 수를 줄여보세요.'); }
  };
  if (id) scr.querySelector('[data-del]').onclick = async () => {
    if (!confirm('이 기록을 지울까요? 되돌릴 수 없어요.')) return;
    await deleteEntry(id); close(); renderHome(); toast('삭제했어요');
  };
}

/* ---------- 사진 크게 보기 ---------- */
function openLightbox(photos, start = 0) {
  const el = document.createElement('div'); el.className = 'lbox';
  el.innerHTML = `
    <div class="lbar">
      <span class="cnt" id="lbCnt">${start + 1} / ${photos.length}</span>
      <button class="iconbtn" data-x aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="lstage" id="lbStage">${photos.map(p => `<img src="${p.data}" alt="">`).join('')}</div>
    ${photos.length > 1 ? `<div class="ldots" id="lbDots">${photos.map((_, i) =>
      `<i class="${i === start ? 'on' : ''}"></i>`).join('')}</div>` : '<div class="ldots"></div>'}`;
  document.body.appendChild(el);
  const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
  el.querySelector('[data-x]').onclick = close;
  el.onclick = e => { if (e.target === el || e.target.id === 'lbStage') close(); };

  const stage = $('#lbStage', el);
  stage.scrollLeft = stage.clientWidth * start;
  let cur = start;
  const sync = () => {
    const i = Math.round(stage.scrollLeft / stage.clientWidth);
    if (i === cur) return;
    cur = i;
    $('#lbCnt', el).textContent = `${i + 1} / ${photos.length}`;
    $$('#lbDots i', el).forEach((d, n) => d.classList.toggle('on', n === i));
  };
  stage.onscroll = sync;
  const onKey = ev => {
    if (ev.key === 'Escape') close();
    else if (ev.key === 'ArrowRight') stage.scrollLeft = stage.clientWidth * Math.min(photos.length - 1, cur + 1);
    else if (ev.key === 'ArrowLeft') stage.scrollLeft = stage.clientWidth * Math.max(0, cur - 1);
  };
  document.addEventListener('keydown', onKey);
}

/* ============================================================
   돌아보기 (통계)
   ============================================================ */
function openStats() {
  const now = new Date(), ym = ymd(now).slice(0, 7);
  const famCount = {}, wordCount = {}, tagFam = {};
  for (const m of S.index) {
    for (const w of m.emos || []) {
      wordCount[w] = (wordCount[w] || 0) + 1;
      const f = famOf(w); famCount[f] = (famCount[f] || 0) + 1;
      for (const t of m.tags || []) {
        tagFam[t] = tagFam[t] || {}; tagFam[t][w] = (tagFam[t][w] || 0) + 1;
      }
    }
  }
  const maxF = Math.max(1, ...Object.values(famCount));
  const topWords = Object.entries(wordCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const insights = Object.entries(tagFam).map(([t, ws]) => {
    const [w, c] = Object.entries(ws).sort((a, b) => b[1] - a[1])[0];
    return { t, w, c };
  }).filter(x => x.c >= 2).sort((a, b) => b.c - a.c).slice(0, 6);

  const days = [...new Set(S.index.map(m => m.date))].sort().reverse();
  let streak = 0; const cur = new Date();
  for (; ;) {
    const k = ymd(cur);
    if (days.includes(k)) { streak++; cur.setDate(cur.getDate() - 1); }
    else if (streak === 0 && k === ymd(new Date())) { cur.setDate(cur.getDate() - 1); }
    else break;
  }

  /* ---- 루틴 쪽 계산 ---- */
  const r30 = routineRangeStats(30);
  const rStreak = routineStreak();
  const rRows = Object.values(r30.per).sort((a, b) => (b.done / b.plan) - (a.done / a.plan));
  const rInsights = routineEmotionInsights();
  const hasRoutine = S.routines.some(r => r.active !== false);

  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<div class="inner">
    <div class="screenbar">
      <button class="iconbtn" data-x><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl">돌아보기</div></div>
    <div id="stCal"></div>

    <div class="eyebrow" style="padding:0">전체</div>
    <div class="statgrid">
      <div class="stat"><b>${S.index.length}</b><span>전체 기록</span></div>
      <div class="stat"><b>${streak}</b><span>연속 기록일</span></div>
      <div class="stat"><b>${hasRoutine ? rStreak : '—'}</b><span>연속 달성일</span></div>
    </div>

    ${hasRoutine ? `
    <div class="eyebrow" style="padding:0">루틴별 달성률 · 30일</div>
    ${rRows.length ? rRows.map(x => {
      const rate = x.done / x.plan;
      return `<div class="barrow"><span class="nm" style="width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.r.emoji || '')} ${esc(x.r.name)}</span>
        <span class="tr"><span class="fl" style="width:${rate * 100}%;background:${lightOf(rate).color}"></span></span>
        <span class="ct">${Math.round(rate * 100)}%</span></div>`;
    }).join('')
      : '<div style="color:var(--faint);font-size:13px">아직 예정된 루틴이 없었어요.</div>'}

    <div class="eyebrow" style="padding:0">루틴이 부른 감정</div>
    <div style="font-size:11.5px;color:var(--faint);margin:-4px 0 9px">
      일기를 쓴 날만 세어, 루틴을 지킨 날과 그러지 못한 날의 기쁨·평온·힘 계열 비율을 견줘 봤어요.</div>
    ${rInsights.length ? rInsights.map(x => `<div class="rowitem"><div class="rl">
        <b>${esc(x.r.emoji || '')} ${esc(x.r.name)}</b>
        <span>지킨 날 ${x.dd}일 · 못 지킨 날 ${x.md}일</span></div>
        <span class="etag" style="background:${(x.a > x.b ? famColor('calm') : famColor('mad'))}22;color:${x.a > x.b ? famColor('calm') : famColor('mad')}">${Math.round(x.a * 100)}% ↔ ${Math.round(x.b * 100)}%</span></div>`).join('')
      : '<div style="color:var(--faint);font-size:13px">지킨 날과 못 지킨 날이 각각 3일 이상 쌓이고, 그날의 일기가 있으면 여기 나타나요.</div>'}
    ` : ''}
    <div class="eyebrow" style="padding:0">감정의 분포</div>
    ${FAMILIES.map(f => `<div class="barrow"><span class="nm">${f.name}</span>
      <span class="tr"><span class="fl" style="width:${(famCount[f.id] || 0) / maxF * 100}%;background:${famColor(f.id)}"></span></span>
      <span class="ct">${famCount[f.id] || 0}</span></div>`).join('')}
    <div class="eyebrow" style="padding:0">자주 느낀 감정</div>
    <div style="font-size:11.5px;color:var(--faint);margin:-4px 0 9px">단어를 누르면 그 감정이 담긴 카드를 모아 볼 수 있어요.</div>
    <div class="words">${topWords.map(([w, c]) =>
      `<button class="word" data-emo="${esc(w)}" style="border-color:${colorOf(w)}55;color:${colorOf(w)}">${esc(w)} <span class="mono" style="opacity:.65">${c}</span></button>`).join('')
      || '<span style="color:var(--faint);font-size:13px">아직 데이터가 없어요.</span>'}</div>
    <div class="eyebrow" style="padding:0">태그가 부르는 감정</div>
    ${insights.length ? insights.map(i => `<div class="rowitem"><div class="rl">
        <b>${esc(i.t)}</b><span>가장 자주 함께 나온 감정</span></div>
        <span class="etag" style="background:${colorOf(i.w)}22;color:${colorOf(i.w)}">${esc(i.w)} ${i.c}회</span></div>`).join('')
      : '<div style="color:var(--faint);font-size:13px">태그와 감정이 2회 이상 겹치면 여기 나타나요.</div>'}
  </div>`;
  $('#layers').appendChild(scr);
  scr.querySelector('[data-x]').onclick = () => scr.remove();
  $$('[data-emo]', scr).forEach(b => b.onclick = () => openEmotionCards(b.dataset.emo));

  /* 달력은 달을 넘길 때마다 다시 그린다 */
  let view = ym;
  const paintCal = () => {
    $('#stCal', scr).innerHTML = calendarHTML(view);
    const host = $('#stCal', scr);
    host.querySelector('[data-prev]').onclick = () => { view = shiftMonth(view, -1); paintCal(); };
    const nx = host.querySelector('[data-next]');
    nx.onclick = () => { view = shiftMonth(view, 1); paintCal(); };
    host.querySelector('[data-today]').onclick = () => { view = ymd(new Date()).slice(0, 7); paintCal(); };
    $$('[data-day]', host).forEach(b => b.onclick = () => openDayReview(b.dataset.day, paintCal));
  };
  paintCal();
}

const shiftMonth = (ym, n) => {
  const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
};

/* 한 달을 통째로 그린다.
   칸 색은 그날 루틴 달성률, 아래 띠는 그날 일기에 담긴 감정 계열. */
function calendarHTML(ym) {
  const today = ymd(new Date());
  const Y = +ym.slice(0, 4), M = +ym.slice(5, 7);
  const lead = new Date(Y, M - 1, 1).getDay();
  const last = new Date(Y, M, 0).getDate();

  const byDate = {};
  for (const m of S.index) (byDate[m.date] = byDate[m.date] || []).push(m);

  let cells = '';
  for (let i = 0; i < lead; i++) cells += `<span class="cday blank"></span>`;
  let entryDays = 0, entryCount = 0, plan = 0, done = 0, full = 0, planned = 0;

  for (let d = 1; d <= last; d++) {
    const key = `${ym}-${pad(d)}`;
    const metas = byDate[key] || [];
    if (metas.length) { entryDays++; entryCount += metas.length; }

    if (key > today) { cells += `<span class="cday later">${d}</span>`; continue; }

    const p = dayProgress(key);
    if (p.total > 0) {
      planned++; plan += p.target; done += p.credit;   /* 쉼은 절반으로 */
      if (p.left === 0) full++;
    }
    let style = '';
    if (p.rate >= 0) {
      const a = Math.round((.2 + p.rate * .6) * 255).toString(16).padStart(2, '0');
      style = `background:${lightOf(p.rate).color}${a}`;
    }
    const fams = [...new Set(metas.flatMap(m => m.fams || []))];
    const bar = fams.length
      ? `<span class="bar">${fams.map(f => `<i style="background:${famColor(f)}"></i>`).join('')}</span>` : '';
    const cls = ['cday', metas.length || p.rate >= 0 ? 'lit' : '', key === today ? 'today' : ''].filter(Boolean).join(' ');
    const tip = [key, p.total ? `${p.done + p.tdone}/${p.target}${p.rest ? ` · 쉼 ${p.rest}` : ''}${p.doing ? ` · 진행 중 ${p.doing}` : ''}` : '', metas.length ? `기록 ${metas.length}개` : '']
      .filter(Boolean).join(' · ');
    cells += `<button class="${cls}" data-day="${key}" title="${esc(tip)}" style="${style}">${d}${bar}</button>`;
  }

  const rate = plan ? done / plan : -1;
  return `
    <div class="calnav">
      <b>${Y}년 ${M}월</b>
      <button class="tdy" data-today>이번 달</button>
      <button data-prev aria-label="지난 달"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button data-next aria-label="다음 달" ${ym >= today.slice(0, 7) ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="cal">
      ${DOW.map(d => `<span class="dw">${d}</span>`).join('')}
      ${cells}
    </div>
    <div class="calleg">
      <span><i style="background:${famColor('mad')}99"></i>낮음</span>
      <span><i style="background:${famColor('joy')}99"></i>보통</span>
      <span><i style="background:${famColor('calm')}cc"></i>지킴</span>
      <span><i class="b"></i>그날의 감정</span>
    </div>
    <div class="statgrid">
      <div class="stat"><b>${entryDays}</b><span>기록한 날${entryCount > entryDays ? ` · ${entryCount}개` : ''}</span></div>
      <div class="stat"><b${rate >= 0 ? ` style="color:${lightOf(rate).color}"` : ''}>${rate < 0 ? '—' : Math.round(rate * 100) + '%'}</b><span>루틴 달성률</span></div>
      <div class="stat"><b>${planned ? full : '—'}</b><span>모두 지킨 날</span></div>
    </div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:10px">
      날짜를 누르면 그날의 루틴과 기록을 볼 수 있어요.</div>`;
}

/* ---------- 하루 돌아보기 ---------- */
async function openDayReview(date, onChange) {
  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<div class="inner">
    <div class="screenbar">
      <button class="iconbtn" data-x><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl">하루 돌아보기</div></div>
    <div id="dvBody"></div>
  </div>`;
  $('#layers').appendChild(scr);
  scr.querySelector('[data-x]').onclick = () => { scr.remove(); onChange && onChange(); };

  const paint = () => {
    const p = dayProgress(date);
    const L = lightOf(p.rate);
    const metas = S.index.filter(m => m.date === date);
    let h = `<div class="dayhead"><span class="dl">${dateLabel(date)}</span>
      ${p.total ? `<span class="dp" style="background:${L.color}22;color:${L.color}">${Math.round(p.rate * 100)}%</span>` : ''}</div>`;

    if (p.total) {
      const bits = [`${p.done + p.tdone}/${p.target}`];
      if (p.rest) bits.push(`쉼 ${p.rest}`);
      if (p.todos.length) bits.push(`할 일 ${p.todos.length}`);
      h += `<div class="eyebrow" style="padding:0">루틴과 할 일 · ${bits.join(' · ')}</div>`;
      for (const r of sortRoutines(p.list)) h += routineRowHTML(r, p.ck[r.id] || {});
      for (const t of p.todos) h += todoRowHTML(t);
      h += `<div style="font-size:11.5px;color:var(--faint);margin-top:4px">
        줄을 누르면 그날의 체크와 메모를 고칠 수 있어요.</div>`;
    }

    h += `<div class="eyebrow" style="padding:0">기록 ${metas.length ? metas.length + '개' : ''}</div>`;
    if (metas.length) {
      h += metas.map(m => {
        const th = (S.thumbs[date.slice(0, 7)] || {})[m.id];
        return `<button class="memory" style="width:100%;text-align:left;margin:0 0 9px" data-go="${m.id}">
          ${th ? `<img src="${th}" alt="">`
            : `<div style="width:52px;height:52px;border-radius:10px;flex:none;background:${gradOf(m.fams)}"></div>`}
          <div style="min-width:0">
            <div class="t">${(m.emos || []).slice(0, 3).map(esc).join(' · ') || '감정 없음'}</div>
            <div class="b">${esc(m.preview || '기록이 있어요')}</div></div>
        </button>`;
      }).join('');
    } else {
      h += `<div style="color:var(--faint);font-size:13px">이 날 남긴 기록이 없어요.</div>`;
    }

    if (!p.total && !metas.length) {
      h = `<div class="dayhead"><span class="dl">${dateLabel(date)}</span></div>
        <div class="empty"><b>조용한 하루였네요</b>예정된 루틴도, 남긴 기록도 없는 날이에요.</div>`;
    }

    const body = $('#dvBody', scr);
    body.innerHTML = h;
    /* 지난 날 화면에서는 줄 어디를 눌러도 고치는 창이 열린다 */
    $$('.ritem', body).forEach(row => {
      const rid = row.dataset.r, tid = row.dataset.t;
      $$('[data-ck],[data-opt]', row).forEach(b => b.onclick = () => rid
        ? openRoutineOptions(rid, date, { after: paint })
        : openTodoOptions(tid, date, { after: paint }));
    });
    $$('[data-go]', body).forEach(b => b.onclick = () => openDetail(b.dataset.go));
  };
  paint();
}

async function openEmotionCards(word) {

  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<div class="inner">
    <div class="screenbar">
      <button class="iconbtn" data-x><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl">감정으로 모아보기</div></div>
    <div style="display:flex;align-items:center;gap:9px;margin:18px 0 4px">
      <span class="etag" style="background:${c}22;color:${c};border:1px solid ${c}55;font-size:14px;padding:5px 13px">${esc(word)}</span>
      <span style="font-size:12.5px;color:var(--faint)" id="ecCount">불러오는 중…</span>

    <div id="ecList" style="margin-top:14px"></div>

      <div class="cd">${dateLabel(r.date)}</div>

      <div class="ctags">${r.card.emotions.map(w =>
        `<span class="etag" style="background:${colorOf(w)}22;color:${colorOf(w)};border:1px solid ${colorOf(w)}55">${esc(w)}</span>`).join('')}</div>
      ${r.card.need ? `<div class="cne">바람 · ${esc(r.card.need)}</div>` : ''}
    </button>`).join('');
  $$('[data-go]', list).forEach(b => b.onclick = () => openDetail(b.dataset.go));
}

/* ============================================================

   ============================================================ */
function openPromptList() {
  const answered = {};
  for (const m of S.index) if (m.pq) answered[m.pq] = (answered[m.pq] || 0) + 1;
  const cats = [];
  for (const [cat, q] of PROMPTS) {
    let g = cats.find(x => x.cat === cat);
    if (!g) cats.push(g = { cat, items: [] });
    g.items.push(q);
  }
  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<div class="inner">
    <div class="screenbar">
      <button class="iconbtn" data-x><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl">질문 모아보기</div></div>
    <div style="font-size:12.5px;color:var(--faint);margin:16px 0 2px">
      영역을 펼쳐 질문을 고르면 그동안 적은 답변을 최신순으로 볼 수 있어요.</div>
    ${cats.map((g, i) => {
      const done = g.items.filter(q => answered[q]).length;
      return `<div class="qcat" data-i="${i}">
        <button data-toggle><b>${esc(g.cat)}</b>
          ${done ? `<span class="bdg">${done}</span>` : ''}
          <svg class="ar" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="qitems hide">${g.items.map(q =>
          `<button class="qitem ${answered[q] ? 'done' : ''}" data-q="${esc(q)}" data-cat="${esc(g.cat)}">
            <span class="qt">${esc(q)}</span>
            ${answered[q] ? `<span class="qc">${answered[q]}</span>` : ''}
          </button>`).join('')}</div>
      </div>`;
    }).join('')}
  </div>`;
  $('#layers').appendChild(scr);
  scr.querySelector('[data-x]').onclick = () => scr.remove();
  $$('.qcat', scr).forEach(box => {
    box.querySelector('[data-toggle]').onclick = () => {

  });
  $$('.qitem', scr).forEach(b => b.onclick = () => openPromptAnswers(b.dataset.cat, b.dataset.q));
}

   맨 앞의 BOM 은 엑셀이 한글을 깨뜨리지 않게 하는 표시. 없으면 글자가 깨져서 열린다.
   쉼표와 따옴표가 든 문장이 있어 모든 칸을 따옴표로 감싼다. */
function exportAffirmationsCSV() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['날짜', '주제', '확언(한국어)', '확언(영어)']]
    .concat(AFFIRMATIONS.map(([d, t, ko, en]) => [d, t, ko, en]));

  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);

}

async function exportAll() {
  toast('내보내는 중…');

  };

async function importAll(file) {
  const text = await file.text();
  let data; try { data = JSON.parse(text); } catch (e) { toast('파일을 읽을 수 없어요'); return; }
  const hasEntries = Array.isArray(data.entries), hasRoutines = Array.isArray(data.routines);
  if (!hasEntries && !hasRoutines) { toast('백업 파일 형식이 아니에요'); return; }
  let n = 0;
  for (const e of (hasEntries ? data.entries : [])) {
    if (S.index.some(m => m.id === e.id)) continue;
    const cover = e.photos.find(p => p.id === e.cover) || e.photos[0];
    await saveEntry(e, cover ? (cover.thumb || cover.data) : '');
    n++;
  }

  /* 직접 만든 시간대 — 루틴보다 먼저 넣어야 불러온 루틴이 제자리를 찾는다 */
  if (Array.isArray(data.slots)) {
    let sn = 0;
    for (const s of data.slots) {
      if (!s || !s.id || S.slots.some(x => x.id === s.id || x.name === s.name)) continue;
      S.slots.push({ id: s.id, name: s.name, icon: s.icon || '🕘' });
      sn++;
    }
    if (sn) await saveSlots();
  }

  /* 루틴 — 같은 id 는 건너뛰고 뒤에 이어 붙인다 */
  let rn = 0;
  if (hasRoutines) {
    let order = S.routines.length ? Math.max(...S.routines.map(x => x.order || 0)) + 1 : 0;
    for (const r of data.routines) {
      if (!r || !r.id || S.routines.some(x => x.id === r.id)) continue;
      S.routines.push(Object.assign({}, r, { order: order++ }));
      rn++;
    }
    if (rn) await saveRoutines();
  }

  /* 루틴 묶음 — 같은 id 는 건너뛰고 뒤에 이어 붙인다 */
  let gn = 0;
  if (Array.isArray(data.groups)) {
    let gorder = S.groups.length ? Math.max(...S.groups.map(x => x.order || 0)) + 1 : 0;
    for (const g of data.groups) {
      if (!g || !g.id || S.groups.some(x => x.id === g.id)) continue;
      S.groups.push({
        id: g.id, name: String(g.name || '이름 없는 묶음').slice(0, 20),
        color: (GROUP_COLORS.some(c => c.id === g.color) ? g.color : GROUP_COLORS[0].id),
        fold: !!g.fold, order: gorder++
      });
      gn++;
    }
    if (gn) await saveGroups();
  }

  /* 체크 기록 — 이미 있는 칸은 덮어쓰지 않는다 */
  let cn = 0;
  if (data.checks && typeof data.checks === 'object') {
    for (const [ym, bucket] of Object.entries(data.checks)) {
      if (!bucket || typeof bucket !== 'object') continue;
      const cur = S.checks[ym] || (S.checks[ym] = {});
      let hit = false;
      for (const [date, day] of Object.entries(bucket)) {
        if (!day || typeof day !== 'object') continue;
        const t = cur[date] || (cur[date] = {});
        for (const [rid, v] of Object.entries(day)) if (!t[rid]) { t[rid] = v; cn++; hit = true; }
        if (!Object.keys(t).length) delete cur[date];
      }
      if (hit) await KV.set(K.check(ym), cur);
    }
  }

  /* 할 일 — 같은 id 는 건너뛰고 그날 목록 뒤에 이어 붙인다 */
  let tn = 0;
  if (data.todos && typeof data.todos === 'object') {
    for (const [ym, bucket] of Object.entries(data.todos)) {
      if (!bucket || typeof bucket !== 'object') continue;
      const cur = S.todos[ym] || (S.todos[ym] = {});
      let hit = false;
      for (const [date, list] of Object.entries(bucket)) {
        if (!Array.isArray(list)) continue;
        const mine = cur[date] || (cur[date] = []);
        for (const t of list) {
          if (!t || !t.id || mine.some(x => x.id === t.id)) continue;
          mine.push(t); tn++; hit = true;
        }
        if (!mine.length) delete cur[date];
      }
      if (hit) await KV.set(K.todo(ym), cur);
    }
  }

  renderHome();
  if (S.tab === 'routine') renderRoutine(); else updateTabBadge();
  const parts = [n ? `기록 ${n}개` : '', rn ? `루틴 ${rn}개` : '', gn ? `묶음 ${gn}개` : '',
    cn ? `체크 ${cn}개` : '', tn ? `할 일 ${tn}개` : ''].filter(Boolean);
  toast(parts.length ? `${parts.join(' · ')}를 불러왔어요` : '새로 불러올 것이 없었어요');
}

  scr.querySelector('[data-pin]').onclick = async () => {
    if (S.settings.pin) { S.settings.pin = ''; await saveSettings(); toast('잠금을 껐어요'); scr.remove(); openSettings(); }
    else {
      const v = prompt('사용할 숫자 4자리를 입력하세요');

/* ---------- 잠금 화면 ---------- */
function lockScreen(onOk) {
  const el = document.createElement('div'); el.className = 'lock';
  el.innerHTML = `<div style="font-family:var(--se);font-size:20px;font-weight:700">마음결</div>
    <div style="font-size:13px;color:var(--faint)">비밀번호를 입력하세요</div>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button style="visibility:hidden"></button><button data-k="0">0</button>
      <button data-k="x" style="font-size:15px">지움</button></div>`;
  document.body.appendChild(el);
  let buf = '';
  const paint = () => $$('#dots i', el).forEach((d, i) => d.classList.toggle('f', i < buf.length));
  $$('.keys button', el).forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (!k) return;
    if (k === 'x') buf = buf.slice(0, -1);
    else if (buf.length < 4) buf += k;
    paint();
    if (buf.length === 4) setTimeout(() => {
      if (buf === S.settings.pin) { el.remove(); onOk(); }
      else { buf = ''; paint(); toast('비밀번호가 달라요'); }
    }, 120);
  });
}

/* ============================================================
   뒤로 가기 (안드로이드 하드웨어 버튼 · 브라우저 뒤로 가기)
   1) 열려 있는 화면/시트/사진 보기가 있으면 그것부터 닫는다.
   2) 홈에서 누르면 종료 안내를 띄우고, 2초 안에 한 번 더 누르면 앱을 나간다.
   ============================================================ */
const EXIT_WINDOW = 2000;                     /* 한 번 더 누를 수 있는 시간 */
const CLOSERS = '.screenbar [data-x], .ph [data-close], .lbar [data-x]';
let exitArmed = false, exitTimer = null, exitPop = null, leaving = false;

/* 뒤로 가기를 받아내기 위한 여분의 방문 기록.
   - 주소가 같으면 설치형 앱에서 "시작 화면 그대로"로 보고 뒤로 가기가
     앱을 그냥 닫아버린다. 그래서 #back 을 붙여 주소를 다르게 만든다.
   - 크롬은 사용자가 손대기 전에 쌓인 기록도 건너뛰므로,
     앱을 켜자마자가 아니라 화면을 만졌을 때 쌓는다. */
const GUARD_URL = '?back=1';                    /* 조각(#)은 주소 비교에서 무시되므로 쿼리를 쓴다 */
let guarded = false;
function pushGuard() {
  if (guarded) return;                          /* 두 겹으로 쌓이지 않게 */
  try { history.pushState({ md: 'guard' }, '', GUARD_URL); guarded = true; } catch (e) { }
}

/* 손가락이 떨어질 때마다 보호가 풀려 있으면 다시 채워 넣는다.
   (누르는 순간(pointerdown)에 쌓은 기록은 크롬이 건너뛰는 일이 있어 제외) */
['pointerup', 'touchend', 'click', 'keydown'].forEach(t =>
  document.addEventListener(t, () => { if (!leaving) pushGuard(); }, { capture: true, passive: true }));

/* 가장 위에 열려 있는 층을 닫는다 (잠금 화면은 건드리지 않는다) */
function closeTopLayer() {
  const layers = $$('.screen,.sheet,.lbox');
  const top = layers[layers.length - 1];
  if (!top) return false;
  const btn = top.querySelector(CLOSERS);
  if (btn) btn.click(); else top.remove();     /* 닫기 버튼의 확인 절차를 그대로 따른다 */
  return true;
}

function hideExitNotice() {
  if (!exitPop) return;
  const el = exitPop; exitPop = null;
  el.classList.add('out'); setTimeout(() => el.remove(), 180);
}

function showExitNotice() {
  hideExitNotice();
  const el = document.createElement('div');
  el.className = 'exitpop';
  el.innerHTML = `
    <span class="eico"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></span>
    <div><b>한 번 더 누르면 마음결을 닫아요</b>
      <span>지금까지 남긴 기록은 그대로 저장돼 있어요</span></div>
    <i class="ebar"></i>`;
  el.onclick = disarmExit;                     /* 안내를 눌러 취소할 수도 있게 */
  document.body.appendChild(el);
  exitPop = el;
}

function disarmExit() {
  if (!exitArmed) return;
  exitArmed = false; clearTimeout(exitTimer);
  hideExitNotice();
}

/* 안내가 뜬 상태에서 한 번 더 눌렀을 때 실제로 앱을 닫는다.
   설치한 앱·스크립트로 연 창은 close() 로 닫히고,
   앞에 방문 기록이 있는 탭이면 그 페이지로 빠져나간다. */
function leaveApp() {
  leaving = true;
  try { window.close(); } catch (e) { }        /* 설치한 앱·스크립트로 연 창은 여기서 닫힌다 */
  setTimeout(() => { try { history.back(); } catch (e) { } }, 80);   /* 아니면 앱 밖으로 */
  setTimeout(() => { leaving = false; }, 700);  /* 못 닫았으면 다음에 손댈 때 다시 보호된다 */
}

window.addEventListener('popstate', () => {
  guarded = false;                             /* 쌓아둔 기록을 방금 써버렸다 */
  if (leaving) return;                         /* 나가는 중 */

  if (closeTopLayer()) { disarmExit(); pushGuard(); return; }

  /* 다른 날을 보던 중이면 먼저 오늘로 돌아온다 */
  if (S.tab === 'routine' && S.rday && S.rday !== ymd(new Date())) {
    S.rday = ymd(new Date()); renderRoutine();
    disarmExit(); pushGuard(); return;
  }
  /* 루틴 탭에서 눌렀으면 먼저 기록 탭으로 돌아온다 (바로 종료되지 않게) */
  if (S.tab !== 'diary') { setTab('diary'); disarmExit(); pushGuard(); return; }

  if (!exitArmed) {                            /* 첫 번째 → 안내를 띄운다 */
    exitArmed = true;
    showExitNotice();
    exitTimer = setTimeout(() => { exitArmed = false; hideExitNotice(); }, EXIT_WINDOW);
    /* 여분의 기록을 다시 남겨야 두 번째 누름도 받아낼 수 있다.
       (방문 기록이 없는 탭에서는 이게 없으면 아무 일도 일어나지 않는다) */
    pushGuard();
    return;
  }
  disarmExit();                                /* 두 번째 → 실제로 닫는다 */
  leaveApp();
});

/* ============================================================
   부팅
   ============================================================ */
$('#fabNew').onclick = () => { if (S.tab === 'diary') openEditor(null); else openRoutineEdit(null); };
$$('#tabbar button').forEach(b => b.onclick = () => { if (S.tab !== b.dataset.tab) setTab(b.dataset.tab); });
$('#btnStats').onclick = openStats;
$('#btnSet').onclick = openSettings;
$('#btnSearch').onclick = () => {
  const w = $('#searchWrap'); w.classList.toggle('hide');
  $('#btnSearch').classList.toggle('on', !w.classList.contains('hide'));
  if (!w.classList.contains('hide')) $('#q').focus();
  else { S.query = ''; $('#q').value = ''; renderFeed(); }
};
$('#q').oninput = e => { S.query = e.target.value; renderFeed(); };
$('#btnClearQ').onclick = () => { $('#q').value = ''; S.query = ''; S.tag = ''; renderTagRail(); renderFeed(); };

(async function boot() {
  await loadAll();
  /* 지난번에 남은 ?back=1 을 지워, 항상 깨끗한 주소에서 시작하도록 */
  if (location.search || location.hash) {
    try { history.replaceState(null, '', location.pathname); } catch (e) { }
  }
  try { localStorage.removeItem('md:backlog'); } catch (e) { }   /* 예전 진단 기록 정리 */
  applyTheme(S.settings.theme);
  const start = () => { renderHome(); updateTabBadge(); maybeRemind(); };
  if (S.settings.pin) lockScreen(start); else start();
  /* 뒤로 가기 보호는 화면을 처음 만졌을 때 걸린다 (pushGuard 참고) */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    /* 새 버전이 준비되면 그 자리에서 갈아끼운다.
       (쓰던 화면이 열려 있으면 날아가지 않게 안내만 하고 기다린다) */
    const hadWorker = !!navigator.serviceWorker.controller;
    let swapped = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadWorker || swapped) return;      /* 첫 설치 때는 새로고침하지 않는다 */
      swapped = true;
      if ($$('.screen,.sheet,.lbox,.lock').length) toast('새 버전이 준비됐어요. 다시 열면 적용돼요');
      else location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(() => { });
    /* 앱을 다시 켤 때마다 새 버전이 있는지 확인한다 */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => { });
    });
  }
})();

</script>
