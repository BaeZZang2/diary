<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15131C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="마음결">
<title>마음결 · 감정일기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --r:14px; --sp:16px;
  --ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --se:'Gowun Batang',ui-serif,'Apple SD Gothic Neo',serif;
  --mo:'IBM Plex Mono',ui-monospace,monospace;
}
/* ---------- 색상 테마 ---------- */
:root,:root[data-theme="night"]{
  --bg:#15131C; --surface:#1E1B27; --raised:#272233; --line:#332D42;
  --tx:#EFEBF5; --dim:#A29CB4; --faint:#6E687F;
  --ivory:#F3EEE4; --ink:#15131C;
  --topbg:rgba(21,19,28,.86); --promptgrad:linear-gradient(160deg,#241F33,#1B1826);
  --shadow:0 10px 34px rgba(0,0,0,.55); --shadow2:0 8px 26px rgba(0,0,0,.5);
  --joy:#F2B441; --calm:#5FC3A4; --power:#E8734F;
  --sad:#5B93DB; --mad:#DB4F65; --fear:#9B7BE0; --numb:#8E8AA0;
}
:root[data-theme="bright"]{
  --bg:#FFFFFF; --surface:#F6F7F9; --raised:#EDEFF3; --line:#DEE3EA;
  --tx:#171A21; --dim:#5B6473; --faint:#949CAA;
  --ivory:#1D2129; --ink:#FFFFFF;
  --topbg:rgba(255,255,255,.88); --promptgrad:linear-gradient(160deg,#F2F5FA,#FAFBFD);
  --shadow:0 10px 30px rgba(23,26,33,.16); --shadow2:0 8px 24px rgba(23,26,33,.14);
  --joy:#B0760D; --calm:#26866A; --power:#C04E27; --sad:#2C68B4;
  --mad:#BC2B43; --fear:#6845BC; --numb:#6A7183;
}
:root[data-theme="beige"]{
  --bg:#F7F1E6; --surface:#FDF9F1; --raised:#EFE5D4; --line:#DFD1B9;
  --tx:#3B3226; --dim:#7A6B57; --faint:#A6957D;
  --ivory:#3B3226; --ink:#FDF9F1;
  --topbg:rgba(247,241,230,.9); --promptgrad:linear-gradient(160deg,#F1E6D2,#FBF6EC);
  --shadow:0 10px 30px rgba(59,50,38,.18); --shadow2:0 8px 24px rgba(59,50,38,.15);
  --joy:#A87410; --calm:#347F64; --power:#B84F26; --sad:#33639A;
  --mad:#B23A4C; --fear:#7050AE; --numb:#847660;
}
:root[data-theme="pink"]{
  --bg:#FFF4F6; --surface:#FFFAFB; --raised:#FBE5EB; --line:#F2CFD9;
  --tx:#3F2830; --dim:#8A6270; --faint:#B78E9B;
  --ivory:#3F2830; --ink:#FFFAFB;
  --topbg:rgba(255,244,246,.9); --promptgrad:linear-gradient(160deg,#FCE4EB,#FFF6F8);
  --shadow:0 10px 30px rgba(63,40,48,.16); --shadow2:0 8px 24px rgba(63,40,48,.14);
  --joy:#AC720C; --calm:#2B836B; --power:#BC4C2A; --sad:#3062A6;
  --mad:#B92F4E; --fear:#7247B4; --numb:#8A7079;
}
:root[data-theme="green"]{
  --bg:#0E1A15; --surface:#15241F; --raised:#1D302A; --line:#2A4239;
  --tx:#E6F0EA; --dim:#9BB3A8; --faint:#6B8478;
  --ivory:#EAF3ED; --ink:#0E1A15;
  --topbg:rgba(14,26,21,.86); --promptgrad:linear-gradient(160deg,#1B302A,#132420);
  --shadow:0 10px 34px rgba(0,0,0,.5); --shadow2:0 8px 26px rgba(0,0,0,.45);
  --joy:#E8B54A; --calm:#5FD3AE; --power:#EC7B52; --sad:#5F9BD8;
  --mad:#E05A6E; --fear:#A489E4; --numb:#8FA096;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--ui);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  transition:background-color .28s,color .28s}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
input,textarea{background:transparent;border:0;outline:none;width:100%}
::placeholder{color:var(--faint)}
.hide{display:none !important}
.mono{font-family:var(--mo);font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
#app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative}
header.top{position:sticky;top:0;z-index:40;background:var(--topbg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) var(--sp) 10px}
.brand{font-family:var(--se);font-size:21px;font-weight:700;letter-spacing:.02em;margin-right:auto}
.brand small{font-family:var(--ui);font-weight:300;font-size:11px;color:var(--faint);
  display:block;letter-spacing:.16em;margin-top:-2px}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--dim);
  transition:background .15s,color .15s}
.iconbtn:hover,.iconbtn.on{background:var(--raised);color:var(--tx)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* signature: 30일 감정 띠 */
.ribbon{display:flex;gap:2px;height:22px;padding:0 var(--sp) 10px;align-items:flex-end}
.ribbon i{flex:1;border-radius:2px;min-height:3px;background:var(--line);display:block;
  transition:height .3s}
.ribbon-lab{display:flex;justify-content:space-between;padding:0 var(--sp) 8px;
  font-size:10px;color:var(--faint);letter-spacing:.08em}

/* search */
.searchwrap{padding:0 var(--sp) 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px}
.search svg{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.8}

/* content */
main{padding:0 0 172px}
.section{padding:0 var(--sp)}
.eyebrow{font-size:10.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;
  margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}

/* prompt card */
.prompt{margin:16px var(--sp) 0;background:var(--promptgrad);
  border:1px solid var(--line);border-radius:var(--r);padding:18px}
.prompt .cat{font-size:10.5px;letter-spacing:.16em;color:var(--faint);
  display:flex;align-items:center;gap:8px}
.prompt .cat .more{margin-left:auto;color:var(--dim);letter-spacing:.04em;font-size:11px;
  border-bottom:1px solid var(--line);padding-bottom:1px}
.prompt q{display:block;font-family:var(--se);font-size:18px;line-height:1.65;margin:8px 0 14px;quotes:none}
.prompt .row{display:flex;gap:8px}
.btn{border-radius:10px;padding:9px 14px;font-size:13px;font-weight:500;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-p{background:var(--ivory);color:var(--ink)}
.btn-g{background:var(--raised);color:var(--dim)}
.btn-o{border:1px solid var(--line);color:var(--dim)}

/* memory card */
.memory{margin:14px var(--sp) 0;display:flex;gap:12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px}
.memory img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.memory .t{font-size:12px;color:var(--faint);letter-spacing:.04em}
.memory .b{font-size:13.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tag rail */
.rail{display:flex;gap:7px;overflow-x:auto;padding:0 var(--sp) 2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;
  color:var(--dim);white-space:nowrap;transition:.15s}
.chip.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}

/* feed grid */
.monthhead{padding:22px var(--sp) 8px;display:flex;align-items:baseline;gap:10px}
.monthhead b{font-family:var(--se);font-size:17px;font-weight:700}
.monthhead span{font-size:11px;color:var(--faint);letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surface);display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .txt{padding:9px;font-size:11px;line-height:1.5;color:var(--dim);height:100%;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.tile .d{position:absolute;left:6px;top:6px;font-size:10px;padding:2px 5px;border-radius:5px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);color:#fff;font-family:var(--mo)}
.tile .multi{position:absolute;right:6px;top:6px;width:15px;height:15px;opacity:.9}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:3px;display:flex}
.tile .bar i{flex:1}
.empty{text-align:center;padding:70px 30px;color:var(--faint)}
.empty b{display:block;font-family:var(--se);font-size:17px;color:var(--dim);margin-bottom:6px}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));
  z-index:45;background:var(--ivory);color:var(--ink);height:52px;border-radius:26px;padding:0 22px;
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;
  box-shadow:var(--shadow)}
.fab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* sheets / fullscreen */
.screen{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
.screen .inner{max-width:560px;margin:0 auto;padding:0 var(--sp)
  calc(120px + env(safe-area-inset-bottom))}
.screenbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--sp) 12px;background:var(--topbg);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin:0 calc(var(--sp) * -1) 0}
.screenbar .ttl{font-family:var(--se);font-size:16px;font-weight:700;margin-right:auto}

.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;
  background:rgba(0,0,0,.6);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .panel{width:100%;max-width:560px;margin:0 auto;background:var(--surface);
  border-radius:20px 20px 0 0;max-height:86dvh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);animation:up .24s cubic-bezier(.2,.8,.3,1)}
.sheet .ph{padding:16px var(--sp) 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .ph b{font-size:15px;font-weight:600;margin-right:auto}
.sheet .pb{overflow-y:auto;padding:14px var(--sp) 22px}
.grabber{width:36px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 0}

/* editor */
.field{margin-top:18px}
.label{font-size:11px;letter-spacing:.14em;color:var(--faint);margin-bottom:7px;text-transform:uppercase}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
textarea.body{min-height:130px;resize:vertical;font-size:15.5px;line-height:1.75;font-family:var(--ui)}
.datebtn{display:flex;align-items:center;gap:8px;font-family:var(--mo);font-size:14px;color:var(--dim)}

/* photos */
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.pthumb{position:relative;flex:none;width:92px;height:92px;border-radius:12px;overflow:hidden;
  border:1px solid var(--line)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb.cover{outline:2px solid var(--ivory);outline-offset:-2px}
.pthumb .star,.pthumb .del{position:absolute;width:24px;height:24px;border-radius:8px;display:grid;
  place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.pthumb .star{left:5px;bottom:5px}
.pthumb .del{right:5px;top:5px}
.pthumb svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2}
.pthumb.cover .star svg{fill:var(--ivory);stroke:var(--ivory)}
.padd{flex:none;width:92px;height:92px;border-radius:12px;border:1px dashed var(--line);
  display:grid;place-items:center;color:var(--faint);font-size:11px;gap:2px;text-align:center}
.padd svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;display:block;margin:0 auto 3px}
.coverhint{font-size:11.5px;color:var(--faint);margin-top:7px}

/* emotion card */
.ecard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--faint);
  border-radius:12px;padding:13px 14px;margin-bottom:10px}
.ecard .eh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ecard .eh .n{font-size:11px;letter-spacing:.14em;color:var(--faint)}
.subfield{margin-top:11px}
.subfield .sl{font-size:11.5px;color:var(--faint);margin-bottom:5px;display:flex;gap:6px;align-items:baseline}
.subfield .sl em{font-style:normal;color:#524D62;font-size:10.5px}
.selectbtn{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  background:var(--raised);display:flex;align-items:center;gap:8px;min-height:42px;flex-wrap:wrap}
.selectbtn .ph2{color:var(--faint);font-size:13.5px}
.selectbtn svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;margin-left:auto;flex:none}
.etag{font-size:12.5px;padding:3px 9px;border-radius:999px;font-weight:500}
.mini{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.addbox{width:100%;border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;transition:.15s}
.addbox:active{background:var(--surface)}
.addbox svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}

/* picker */
.tabs{display:flex;flex-shrink:0;gap:6px;overflow-x:auto;padding:12px var(--sp) 10px;scrollbar-width:none;
  border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 13px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--dim)}
.words{display:flex;flex-wrap:wrap;gap:7px}
.word{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--dim)}
.word.on{color:var(--ink);font-weight:600}

/* detail */
.dphotos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--sp)*-1);
  padding:0 var(--sp);scrollbar-width:none}
.dphotos::-webkit-scrollbar{display:none}
.dphotos img{scroll-snap-align:center;width:calc(100% - 40px);flex:none;border-radius:var(--r);
  object-fit:cover;max-height:64dvh}
.dbody{font-family:var(--ui);font-size:15.5px;line-height:1.85;white-space:pre-wrap;margin-top:18px}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dtag{font-size:12.5px;color:var(--dim);background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 12px}
.stat b{display:block;font-family:var(--mo);font-size:21px;font-weight:500}
.stat span{font-size:11px;color:var(--faint)}
.barrow{display:flex;align-items:center;gap:10px;margin-top:9px}
.barrow .nm{width:46px;font-size:12.5px;color:var(--dim);flex:none}
.barrow .tr{flex:1;height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
/* span 은 인라인이라 display 를 주지 않으면 width·height 가 통째로 무시된다 */
.barrow .fl{display:block;height:100%;border-radius:4px}
.barrow .ct{width:26px;text-align:right;font-family:var(--mo);font-size:11.5px;color:var(--faint)}

/* misc */
.rowitem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rowitem .rl{margin-right:auto}
.rowitem .rl b{display:block;font-size:14.5px;font-weight:500}
.rowitem .rl span{font-size:12px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--raised);
  border:1px solid var(--line);border-radius:11px;padding:10px 18px;font-size:13.5px;z-index:200;
  box-shadow:var(--shadow2);animation:fade .2s}
.lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px}
.dots{display:flex;gap:12px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.dots i.f{background:var(--ivory);border-color:var(--ivory)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:6px}
.keys button{height:62px;border-radius:50%;background:var(--surface);font-family:var(--mo);font-size:22px}
/* ---------- 사진 라이트박스 ---------- */
.lbox{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.94);display:flex;
  flex-direction:column;animation:fade .2s}
.lbox .lbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  color:#fff;flex:none}
.lbox .lbar .cnt{font-family:var(--mo);font-size:13px;opacity:.8;margin-right:auto}
.lbox .lbar .iconbtn{color:#fff}
.lbox .lbar .iconbtn:hover{background:rgba(255,255,255,.16)}
.lstage{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  align-items:center}
.lstage::-webkit-scrollbar{display:none}
.lstage img{scroll-snap-align:center;width:100%;flex:none;object-fit:contain;max-height:100%}
.ldots{display:flex;justify-content:center;gap:6px;padding:14px 0 calc(20px + env(safe-area-inset-bottom));flex:none}
.ldots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.32);transition:.2s}
.ldots i.on{background:#fff;width:18px;border-radius:3px}
.dphotos img{cursor:zoom-in}

/* ---------- 감사일기 ---------- */
.gline{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.gline .gn{flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mo);font-size:11px;background:var(--raised);color:var(--faint)}
.gline input{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;font-size:14px}
.gline .gx{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}
.gline .gx svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.gadd{margin-top:2px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.gadd svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.glist{margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.glist li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;list-style:none}
.glist li span{flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mo);font-size:11px;background:var(--raised);color:var(--faint);margin-top:2px}

/* ---------- 테마 고르기 ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:9px;margin-top:12px}
.thbtn{border:1px solid var(--line);border-radius:12px;padding:11px 10px;display:flex;
  flex-direction:column;gap:8px;align-items:flex-start;transition:.15s;position:relative}
.thbtn.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx) inset}
.thbtn .sw{display:flex;gap:4px}

.qcat.open>button .ar{transform:rotate(180deg)}
.qitems{padding:0 0 12px}

.exitpop{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom));

  display:flex;align-items:center;gap:12px;padding:14px 16px 15px;

.exitpop .eico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;

.exitpop .eico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;

.exitpop span{display:block;margin-top:3px;font-size:12px;color:var(--faint);line-height:1.45}
.exitpop .ebar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ivory);

.rmg{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}

/* ---------- 히트맵 ---------- */
.hmapwrap{max-width:300px;margin:0 auto}

.hmap i{aspect-ratio:1;border-radius:5px;background:var(--raised);display:block}
.hdow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;
  font-size:10px;color:var(--faint);text-align:center}
.hleg{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--faint)}
.hleg i{width:11px;height:11px;border-radius:3px;display:block;background:var(--raised)}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

/* ---------- 저장소: Claude 아티팩트에서는 window.storage, 배포 시엔 IndexedDB ---------- */
const KV = (() => {
  if (typeof window !== 'undefined' && window.storage && window.storage.get) {
    const P = window.storage;
    return {
      mode: 'artifact',
      async get(k) { try { const r = await P.get(k, false); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } },
      async set(k, v) { await P.set(k, JSON.stringify(v), false); },
      async del(k) { try { await P.delete(k, false); } catch (e) { } },
      async keys(p) { try { const r = await P.list(p, false); return (r && r.keys || []).map(x => typeof x === 'string' ? x : x.key); } catch (e) { return []; } }
    };
  }
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('maeumgyeol', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const d = await db();
    return new Promise((res, rej) => {
      const req = fn(d.transaction('kv', mode).objectStore('kv'));
      req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
    });
  };
  return {
    mode: 'idb',
    async get(k) { const v = await tx('readonly', s => s.get(k)); return v === undefined ? null : v; },
    async set(k, v) { await tx('readwrite', s => s.put(v, k)); },
    async del(k) { await tx('readwrite', s => s.delete(k)); },
    async keys(p) { const all = await tx('readonly', s => s.getAllKeys()); return all.filter(k => !p || String(k).startsWith(p)); }
  };
})();

/* ---------- 유틸 ---------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}
function famOf(word) { return WORD2FAM[word] || 'numb'; }

/* 감정 색은 테마마다 달라지므로 CSS 변수에서 읽어온다 (테마 변경 시 캐시 비움) */
let _colorCache = {};
function famColor(id) {
  if (_colorCache[id]) return _colorCache[id];
  const v = getComputedStyle(document.documentElement).getPropertyValue('--' + id).trim();
  return (_colorCache[id] = v || (FAM[id] || FAM.numb).color);
}
function colorOf(word) { return famColor(famOf(word)); }
function gradOf(fams) {
  const c = [...new Set(fams)].map(famColor);
  if (!c.length) return 'linear-gradient(150deg,var(--raised),var(--surface))';
  if (c.length === 1) return `linear-gradient(150deg,${c[0]}2E,${c[0]}12)`;
  return `linear-gradient(150deg,${c.map(x => x + '30').join(',')})`;
}

/* ---------- 테마 적용 ---------- */
function applyTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  document.documentElement.setAttribute('data-theme', t.id);
  _colorCache = {};
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content',
    getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#15131C');
}
function dateLabel(s) {
  const d = new Date(s + 'T00:00:00');
  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
}

/* ---------- 이미지 압축 ---------- */
async function shrink(file, max, quality) {
  let bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => {
      const i = new Image(), u = URL.createObjectURL(file);
      i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u;
    });
  }
  const w = bmp.width, h = bmp.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1E1B27'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return c.toDataURL('image/jpeg', quality);
}

/* ---------- 오늘의 질문 (하루 하나, 1년간 중복 없음) ---------- */
function todaysPrompt(dateStr, offset = 0) {
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear();
  const doy = Math.floor((d - new Date(year, 0, 0)) / 864e5);
  let seed = year * 7919 % 233280;
  const order = PROMPTS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    seed = (seed * 9301 + 49297) % 233280;
    const j = Math.floor(seed / 233280 * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return PROMPTS[order[(doy + offset) % PROMPTS.length]];
}

async function setCheck(date, rid, val) {
  const ym = date.slice(0, 7);
  const bucket = S.checks[ym] || (S.checks[ym] = {});
  const day = bucket[date] || (bucket[date] = {});

/* 그날 예정된 루틴.
   보관한 루틴도 보관 전 날짜에는 그대로 세어야 지난 통계가 흔들리지 않는다. */
function routinesOn(date) {
  const dow = new Date(date + 'T00:00:00').getDay();
  return S.routines
    .filter(r => (r.days || []).includes(dow)
      && (!r.startDate || r.startDate <= date)
      && (r.active !== false || (r.archivedDate && date < r.archivedDate)))
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

/* 쉼으로 표시한 루틴은 분모에서 빠진다 (쉬기로 한 것도 지킨 것이다) */
function dayProgress(date) {
  const list = routinesOn(date), ck = dayChecks(date);
  let done = 0, rest = 0;
  for (const r of list) {
    const s = (ck[r.id] || {}).s;
    if (s === 'done') done++; else if (s === 'rest') rest++;
  }
  const target = list.length - rest;
  const rate = target > 0 ? done / target : (list.length ? 1 : -1);
  return { list, ck, done, rest, target, total: list.length, rate };
}

function lightOf(rate) {
  if (rate < 0) return { i: -1, color: 'var(--faint)', msg: '오늘은 예정된 루틴이 없어요' };
  if (rate >= .8) return { i: 2, color: famColor('calm'), msg: '오늘 흐름이 좋아요' };
  if (rate >= .4) return { i: 1, color: famColor('joy'), msg: '절반쯤 왔어요. 남은 건 천천히' };
  return { i: 0, color: famColor('mad'), msg: '하나만 해봐도 충분해요' };
}

async function toggleCheck(rid) {
  const today = ymd(new Date());
  const cur = dayChecks(today)[rid] || {};
  const next = cur.s === 'done'
    ? (cur.memo ? { s: '', memo: cur.memo } : null)
    : Object.assign({}, cur, { s: 'done', at: Date.now() });
  await setCheck(today, rid, next && (next.s || next.memo) ? next : null);
  renderRoutine();
}

/* ---------- 루틴 통계 ---------- */
function routineRangeStats(days) {
  const today = new Date(), per = {};
  let plan = 0, done = 0;
  for (let i = 0; i < days; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = ymd(d), ck = dayChecks(key);
    for (const r of routinesOn(key)) {
      const s = (ck[r.id] || {}).s;
      if (s === 'rest') continue;                     /* 쉼은 세지 않는다 */
      const box = per[r.id] || (per[r.id] = { r, plan: 0, done: 0 });
      box.plan++; plan++;
      if (s === 'done') { box.done++; done++; }
    }
  }
  return { per, plan, done, rate: plan ? done / plan : -1 };
}

/* 예정된 루틴을 모두 지킨 날의 연속. 예정이 없는 날은 끊지 않고 건너뛴다.
   오늘이 아직 안 끝났으면 오늘은 끊지 않고 어제부터 센다. */
function routineStreak() {
  let streak = 0, first = true;
  const cur = new Date();
  for (let i = 0; i < 400; i++) {
    const p = dayProgress(ymd(cur));
    if (p.total > 0) {
      const ok = p.target > 0 ? p.done >= p.target : true;
      if (ok) streak++;
      else if (!first) break;
    }
    cur.setDate(cur.getDate() - 1); first = false;
  }
  return streak;
}

/* 루틴을 지킨 날과 못 지킨 날의 감정을 견줘 본다.
   기쁨·평온·힘 계열을 '올라간 감정'으로 묶고, 그 비율 차이를 본다. */
function routineEmotionInsights(days = 180) {
  const POS = new Set(['joy', 'calm', 'power']);
  const byDate = {};
  for (const m of S.index) (byDate[m.date] = byDate[m.date] || []).push(m);
  const today = new Date(), out = [];
  for (const r of S.routines) {
    if (r.active === false) continue;
    const g = { done: { pos: 0, all: 0, days: 0 }, miss: { pos: 0, all: 0, days: 0 } };
    for (let i = 0; i < days; i++) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const key = ymd(d);
      const metas = byDate[key];
      if (!metas || !routinesOn(key).some(x => x.id === r.id)) continue;
      const s = (dayChecks(key)[r.id] || {}).s;
      if (s === 'rest') continue;
      const box = s === 'done' ? g.done : g.miss;
      box.days++;
      for (const m of metas) for (const w of m.emos || []) { box.all++; if (POS.has(famOf(w))) box.pos++; }
    }
    if (g.done.days < 3 || g.miss.days < 3 || !g.done.all || !g.miss.all) continue;
    const a = g.done.pos / g.done.all, b = g.miss.pos / g.miss.all;
    if (Math.abs(a - b) < .1) continue;
    out.push({ r, a, b, dd: g.done.days, md: g.miss.days });
  }
  return out.sort((x, y) => Math.abs(y.a - y.b) - Math.abs(x.a - x.b)).slice(0, 5);
}

/* 앱을 열었을 때 남은 루틴을 한 번만 알려준다 (웹앱이라 정해진 시각 알림은 못 보낸다) */
function maybeRemind() {
  if (S.settings.remind === false) return;
  const today = ymd(new Date());
  if (S.settings.remindLog === today) return;
  const p = dayProgress(today);
  const left = p.target - p.done;
  if (left <= 0) return;
  S.settings.remindLog = today; saveSettings();
  setTimeout(() => toast(`오늘 남은 루틴이 ${left}개 있어요`), 1000);
}

      <div class="box"><textarea class="body" id="fText" placeholder="무슨 일이 있었는지 편하게 적어보세요.&#10;본문에 #태그 를 쓰면 자동으로 등록돼요.">${esc(entry.text)}</textarea></div>
    </div>

    <div class="field" id="fPromptField"></div>

    <div class="field">
      <div class="label">감사일기</div>
      <div class="box">
        <div id="fGrat"></div>
        <button class="gadd" id="fGratAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>줄 추가</button>
      </div>
    </div>

    <div class="field">
      <div class="label">감정 카드</div>
      <div id="fCards"></div>
      <button class="addbox" id="fAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>감정 카드 추가</button>
    </div>

      <div class="label">해시태그</div>

        <div id="fTags" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>

  /* 사진 */

    $('#fPick', fp).onclick = () => $('#fFile', scr).click();

      box.querySelector('[data-emo]').onclick = () => pickEmotions(c.emotions, sel => { c.emotions = sel; paintCards(); });
      box.querySelector('[data-ev]').oninput = e => c.event = e.target.value;
      box.querySelector('[data-nd]').oninput = e => c.need = e.target.value;
      box.querySelector('[data-needpick]').onclick = () => pickNeed(n => {
        c.need = (c.need ? c.need.replace(/\s*$/, ' ') : '') + n; paintCards();
      });

  }
  $('#fAdd', scr).onclick = () => { entry.cards.push(newCard()); paintCards(); scr.scrollTop = scr.scrollHeight; };
  paintCards();

  /* 태그 */
  function paintTags() {
    $('#fTags', scr).innerHTML = entry.tags.map(t =>
      `<span class="dtag" data-t="${esc(t)}">${esc(t)} ✕</span>`).join('') ||

    e.preventDefault();
    let v = e.target.value.trim().replace(/^#*/, '');
    if (!v) return;
    v = '#' + v;
    if (!entry.tags.includes(v)) entry.tags.push(v);
    e.target.value = ''; paintTags();
  };
  paintTags();

  /* 저장 */
  scr.querySelector('[data-save]').onclick = async () => {
    entry.date = $('#fDate', scr).value || entry.date;
    entry.text = $('#fText', scr).value;
    const pa = $('#fPromptA', scr);
    if (entry.prompt && pa) entry.prompt.a = pa.value;
    entry.gratitude = $$('.gline input', scr).map(i => i.value.trim()).filter(Boolean);
    entry.cards = entry.cards.filter(c => c.emotions.length || c.event.trim() || c.need.trim());
    entry.tags = [...new Set([...entry.tags, ...extractTags(entry.text)])];
    const answered = !!(entry.prompt && entry.prompt.a && entry.prompt.a.trim());
    if (!answered && entry.prompt) entry.prompt = null;  /* 답이 없으면 질문은 남기지 않는다 */
    const hasContent = entry.text.trim() || entry.photos.length || entry.cards.length
      || entry.gratitude.length || answered;
    if (!hasContent) { toast('아직 아무것도 적히지 않았어요'); return; }
    const cover = entry.photos.find(p => p.id === entry.cover) || entry.photos[0];
    try {
      await saveEntry(entry, cover ? cover.thumb : '');
      if (answered) { S.settings.promptLog[entry.date] = true; await saveSettings(); }
      close(); renderHome(); toast('저장했어요');
    } catch (err) { toast('저장에 실패했어요. 사진 수를 줄여보세요.'); }
  };
  if (id) scr.querySelector('[data-del]').onclick = async () => {
    if (!confirm('이 기록을 지울까요? 되돌릴 수 없어요.')) return;
    await deleteEntry(id); close(); renderHome(); toast('삭제했어요');
  };
}

/* ---------- 사진 크게 보기 ---------- */
function openLightbox(photos, start = 0) {
  const el = document.createElement('div'); el.className = 'lbox';
  el.innerHTML = `
    <div class="lbar">
      <span class="cnt" id="lbCnt">${start + 1} / ${photos.length}</span>
      <button class="iconbtn" data-x aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="lstage" id="lbStage">${photos.map(p => `<img src="${p.data}" alt="">`).join('')}</div>
    ${photos.length > 1 ? `<div class="ldots" id="lbDots">${photos.map((_, i) =>
      `<i class="${i === start ? 'on' : ''}"></i>`).join('')}</div>` : '<div class="ldots"></div>'}`;
  document.body.appendChild(el);
  const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
  el.querySelector('[data-x]').onclick = close;
  el.onclick = e => { if (e.target === el || e.target.id === 'lbStage') close(); };

  const stage = $('#lbStage', el);
  stage.scrollLeft = stage.clientWidth * start;
  let cur = start;
  const sync = () => {
    const i = Math.round(stage.scrollLeft / stage.clientWidth);
    if (i === cur) return;
    cur = i;
    $('#lbCnt', el).textContent = `${i + 1} / ${photos.length}`;
    $$('#lbDots i', el).forEach((d, n) => d.classList.toggle('on', n === i));
  };
  stage.onscroll = sync;
  const onKey = ev => {
    if (ev.key === 'Escape') close();
    else if (ev.key === 'ArrowRight') stage.scrollLeft = stage.clientWidth * Math.min(photos.length - 1, cur + 1);
    else if (ev.key === 'ArrowLeft') stage.scrollLeft = stage.clientWidth * Math.max(0, cur - 1);
  };
  document.addEventListener('keydown', onKey);
}

/* ============================================================
   돌아보기 (통계)
   ============================================================ */
function openStats() {
  const now = new Date(), ym = ymd(now).slice(0, 7);
  const month = S.index.filter(m => m.date.startsWith(ym));
  const famCount = {}, wordCount = {}, tagFam = {};
  for (const m of S.index) {
    for (const w of m.emos || []) {
      wordCount[w] = (wordCount[w] || 0) + 1;
      const f = famOf(w); famCount[f] = (famCount[f] || 0) + 1;
      for (const t of m.tags || []) {
        tagFam[t] = tagFam[t] || {}; tagFam[t][w] = (tagFam[t][w] || 0) + 1;
      }
    }
  }
  const maxF = Math.max(1, ...Object.values(famCount));
  const topWords = Object.entries(wordCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const insights = Object.entries(tagFam).map(([t, ws]) => {
    const [w, c] = Object.entries(ws).sort((a, b) => b[1] - a[1])[0];
    return { t, w, c };
  }).filter(x => x.c >= 2).sort((a, b) => b.c - a.c).slice(0, 6);

  const days = [...new Set(S.index.map(m => m.date))].sort().reverse();
  let streak = 0; const cur = new Date();
  for (; ;) {
    const k = ymd(cur);
    if (days.includes(k)) { streak++; cur.setDate(cur.getDate() - 1); }
    else if (streak === 0 && k === ymd(new Date())) { cur.setDate(cur.getDate() - 1); }
    else break;
  }

  /* ---- 루틴 쪽 계산 ---- */
  const rToday = dayProgress(ymd(now));
  const r30 = routineRangeStats(30);
  const rStreak = routineStreak();
  const rRows = Object.values(r30.per).sort((a, b) => (b.done / b.plan) - (a.done / a.plan));
  const rInsights = routineEmotionInsights();
  const hasRoutine = S.routines.some(r => r.active !== false);

  /* 최근 8주 히트맵 — 일요일 시작으로 줄을 맞춘다 */
  const cells = [];
  const end = new Date(now); end.setDate(end.getDate() + (6 - end.getDay()));
  for (let i = 55; i >= 0; i--) {
    const d = new Date(end); d.setDate(d.getDate() - i);
    const key = ymd(d);
    if (key > ymd(now)) { cells.push(`<i style="opacity:.25"></i>`); continue; }
    const p = dayProgress(key);
    if (p.rate < 0) { cells.push(`<i title="${key}"></i>`); continue; }
    const L = lightOf(p.rate);
    cells.push(`<i title="${key} · ${Math.round(p.rate * 100)}%" style="background:${L.color};opacity:${.3 + p.rate * .7}"></i>`);
  }

  const scr = document.createElement('div'); scr.className = 'screen';
  scr.innerHTML = `<div class="inner">
    <div class="screenbar">
      <button class="iconbtn" data-x><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ttl">돌아보기</div></div>
    <div class="statgrid">

async function exportAll() {
  toast('내보내는 중…');
  const out = {
    app: 'maeumgyeol', version: 2, exportedAt: new Date().toISOString(),
    entries: [], routines: S.routines, checks: S.checks
  };
  for (const m of S.index) { const e = await getEntry(m.id); if (e) out.entries.push(e); }
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `마음결_백업_${ymd(new Date())}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importAll(file) {
  const text = await file.text();
  let data; try { data = JSON.parse(text); } catch (e) { toast('파일을 읽을 수 없어요'); return; }
  const hasEntries = Array.isArray(data.entries), hasRoutines = Array.isArray(data.routines);
  if (!hasEntries && !hasRoutines) { toast('백업 파일 형식이 아니에요'); return; }
  let n = 0;
  for (const e of (hasEntries ? data.entries : [])) {
    if (S.index.some(m => m.id === e.id)) continue;
    const cover = e.photos.find(p => p.id === e.cover) || e.photos[0];
    await saveEntry(e, cover ? (cover.thumb || cover.data) : '');
    n++;
  }

  /* 루틴 — 같은 id 는 건너뛰고 뒤에 이어 붙인다 */
  let rn = 0;
  if (hasRoutines) {
    let order = S.routines.length ? Math.max(...S.routines.map(x => x.order || 0)) + 1 : 0;
    for (const r of data.routines) {
      if (!r || !r.id || S.routines.some(x => x.id === r.id)) continue;
      S.routines.push(Object.assign({}, r, { order: order++ }));
      rn++;
    }
    if (rn) await saveRoutines();
  }

  /* 체크 기록 — 이미 있는 칸은 덮어쓰지 않는다 */
  let cn = 0;
  if (data.checks && typeof data.checks === 'object') {
    for (const [ym, bucket] of Object.entries(data.checks)) {
      if (!bucket || typeof bucket !== 'object') continue;
      const cur = S.checks[ym] || (S.checks[ym] = {});
      let hit = false;
      for (const [date, day] of Object.entries(bucket)) {
        if (!day || typeof day !== 'object') continue;
        const t = cur[date] || (cur[date] = {});
        for (const [rid, v] of Object.entries(day)) if (!t[rid]) { t[rid] = v; cn++; hit = true; }
        if (!Object.keys(t).length) delete cur[date];
      }
      if (hit) await KV.set(K.check(ym), cur);
    }
  }

  renderHome();
  if (S.tab === 'routine') renderRoutine(); else updateTabBadge();
  const parts = [n ? `기록 ${n}개` : '', rn ? `루틴 ${rn}개` : '', cn ? `체크 ${cn}개` : ''].filter(Boolean);
  toast(parts.length ? `${parts.join(' · ')}를 불러왔어요` : '새로 불러올 것이 없었어요');
}

function lockScreen(onOk) {
  const el = document.createElement('div'); el.className = 'lock';
  el.innerHTML = `<div style="font-family:var(--se);font-size:20px">마음결</div>
    <div style="font-size:13px;color:var(--faint)">비밀번호를 입력하세요</div>

    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button style="visibility:hidden"></button><button data-k="0">0</button>
      <button data-k="x" style="font-size:15px">지움</button></div>`;
  document.body.appendChild(el);
  let buf = '';
  const paint = () => $$('#dots i', el).forEach((d, i) => d.classList.toggle('f', i < buf.length));
  $$('.keys button', el).forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (!k) return;
    if (k === 'x') buf = buf.slice(0, -1);
    else if (buf.length < 4) buf += k;
    paint();
    if (buf.length === 4) setTimeout(() => {
      if (buf === S.settings.pin) { el.remove(); onOk(); }
      else { buf = ''; paint(); toast('비밀번호가 달라요'); }
    }, 120);
  });
}

/* ============================================================
   뒤로 가기 (안드로이드 하드웨어 버튼 · 브라우저 뒤로 가기)
   1) 열려 있는 화면/시트/사진 보기가 있으면 그것부터 닫는다.
   2) 홈에서 누르면 종료 안내를 띄우고, 2초 안에 한 번 더 누르면 앱을 나간다.
   ============================================================ */
const EXIT_WINDOW = 2000;                     /* 한 번 더 누를 수 있는 시간 */
const CLOSERS = '.screenbar [data-x], .ph [data-close], .lbar [data-x]';
let exitArmed = false, exitTimer = null, exitPop = null, leaving = false;

/* 뒤로 가기를 받아내기 위한 여분의 방문 기록.
   - 주소가 같으면 설치형 앱에서 "시작 화면 그대로"로 보고 뒤로 가기가
     앱을 그냥 닫아버린다. 그래서 #back 을 붙여 주소를 다르게 만든다.
   - 크롬은 사용자가 손대기 전에 쌓인 기록도 건너뛰므로,
     앱을 켜자마자가 아니라 화면을 만졌을 때 쌓는다. */
const GUARD_URL = '?back=1';                    /* 조각(#)은 주소 비교에서 무시되므로 쿼리를 쓴다 */
let guarded = false;
function pushGuard() {
  if (guarded) return;                          /* 두 겹으로 쌓이지 않게 */
  try { history.pushState({ md: 'guard' }, '', GUARD_URL); guarded = true; } catch (e) { }
}

/* 손가락이 떨어질 때마다 보호가 풀려 있으면 다시 채워 넣는다.
   (누르는 순간(pointerdown)에 쌓은 기록은 크롬이 건너뛰는 일이 있어 제외) */
['pointerup', 'touchend', 'click', 'keydown'].forEach(t =>
  document.addEventListener(t, () => { if (!leaving) pushGuard(); }, { capture: true, passive: true }));

/* 가장 위에 열려 있는 층을 닫는다 (잠금 화면은 건드리지 않는다) */
function closeTopLayer() {
  const layers = $$('.screen,.sheet,.lbox');
  const top = layers[layers.length - 1];
  if (!top) return false;
  const btn = top.querySelector(CLOSERS);
  if (btn) btn.click(); else top.remove();     /* 닫기 버튼의 확인 절차를 그대로 따른다 */
  return true;
}

function hideExitNotice() {
  if (!exitPop) return;
  const el = exitPop; exitPop = null;
  el.classList.add('out'); setTimeout(() => el.remove(), 180);
}

function showExitNotice() {
  hideExitNotice();
  const el = document.createElement('div');
  el.className = 'exitpop';
  el.innerHTML = `
    <span class="eico"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></span>
    <div><b>한 번 더 누르면 마음결을 닫아요</b>
      <span>지금까지 남긴 기록은 그대로 저장돼 있어요</span></div>
    <i class="ebar"></i>`;
  el.onclick = disarmExit;                     /* 안내를 눌러 취소할 수도 있게 */
  document.body.appendChild(el);
  exitPop = el;
}

function disarmExit() {
  if (!exitArmed) return;
  exitArmed = false; clearTimeout(exitTimer);
  hideExitNotice();
}

/* 안내가 뜬 상태에서 한 번 더 눌렀을 때 실제로 앱을 닫는다.
   설치한 앱·스크립트로 연 창은 close() 로 닫히고,
   앞에 방문 기록이 있는 탭이면 그 페이지로 빠져나간다. */
function leaveApp() {
  leaving = true;
  try { window.close(); } catch (e) { }        /* 설치한 앱·스크립트로 연 창은 여기서 닫힌다 */
  setTimeout(() => { try { history.back(); } catch (e) { } }, 80);   /* 아니면 앱 밖으로 */
  setTimeout(() => { leaving = false; }, 700);  /* 못 닫았으면 다음에 손댈 때 다시 보호된다 */
}

window.addEventListener('popstate', () => {
  guarded = false;                             /* 쌓아둔 기록을 방금 써버렸다 */
  if (leaving) return;                         /* 나가는 중 */

  if (closeTopLayer()) { disarmExit(); pushGuard(); return; }

  /* 루틴 탭에서 눌렀으면 먼저 기록 탭으로 돌아온다 (바로 종료되지 않게) */
  if (S.tab !== 'diary') { setTab('diary'); disarmExit(); pushGuard(); return; }

  if (!exitArmed) {                            /* 첫 번째 → 안내를 띄운다 */
    exitArmed = true;
    showExitNotice();
    exitTimer = setTimeout(() => { exitArmed = false; hideExitNotice(); }, EXIT_WINDOW);
    /* 여분의 기록을 다시 남겨야 두 번째 누름도 받아낼 수 있다.
       (방문 기록이 없는 탭에서는 이게 없으면 아무 일도 일어나지 않는다) */
    pushGuard();
    return;
  }
  disarmExit();                                /* 두 번째 → 실제로 닫는다 */
  leaveApp();
});

/* ============================================================
   부팅
   ============================================================ */
$('#fabNew').onclick = () => { if (S.tab === 'diary') openEditor(null); else openRoutineEdit(null); };
$$('#tabbar button').forEach(b => b.onclick = () => { if (S.tab !== b.dataset.tab) setTab(b.dataset.tab); });
$('#btnStats').onclick = openStats;
$('#btnSet').onclick = openSettings;
$('#btnSearch').onclick = () => {
  const w = $('#searchWrap'); w.classList.toggle('hide');
  $('#btnSearch').classList.toggle('on', !w.classList.contains('hide'));
  if (!w.classList.contains('hide')) $('#q').focus();
  else { S.query = ''; $('#q').value = ''; renderFeed(); }
};
$('#q').oninput = e => { S.query = e.target.value; renderFeed(); };
$('#btnClearQ').onclick = () => { $('#q').value = ''; S.query = ''; S.tag = ''; renderTagRail(); renderFeed(); };

(async function boot() {
  await loadAll();
  /* 지난번에 남은 ?back=1 을 지워, 항상 깨끗한 주소에서 시작하도록 */
  if (location.search || location.hash) {
    try { history.replaceState(null, '', location.pathname); } catch (e) { }
  }
  try { localStorage.removeItem('md:backlog'); } catch (e) { }   /* 예전 진단 기록 정리 */
  applyTheme(S.settings.theme);
  const start = () => { renderHome(); updateTabBadge(); maybeRemind(); };
  if (S.settings.pin) lockScreen(start); else start();
  /* 뒤로 가기 보호는 화면을 처음 만졌을 때 걸린다 (pushGuard 참고) */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    /* 새 버전이 준비되면 그 자리에서 갈아끼운다.
       (쓰던 화면이 열려 있으면 날아가지 않게 안내만 하고 기다린다) */
    const hadWorker = !!navigator.serviceWorker.controller;
    let swapped = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadWorker || swapped) return;      /* 첫 설치 때는 새로고침하지 않는다 */
      swapped = true;
      if ($$('.screen,.sheet,.lbox,.lock').length) toast('새 버전이 준비됐어요. 다시 열면 적용돼요');
      else location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(() => { });
    /* 앱을 다시 켤 때마다 새 버전이 있는지 확인한다 */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => { });
    });
  }
})();

</script>
</body>
